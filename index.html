<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Right Site Light — A page so customers can find you again</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ss_theme');
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) { /* private mode */ }
      })();
    </script>
    <meta name="description" content="A simple page for your hours, menu, and how to find you — so the people who already care can come back." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Right Site Light — A page so customers can find you again" />
    <meta property="og:description" content="A simple page for your hours, menu, and how to find you — so the people who already care can come back." />
    <meta property="og:image" content="/assets/og-image.jpg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Right Site Light — A page so customers can find you again" />
    <meta name="twitter:description" content="A simple page for your hours, menu, and how to find you — so the people who already care can come back." />
    <meta name="twitter:image" content="/assets/og-image.jpg" />
    
    <!-- Performance: Resource Hints -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Cloudflare Turnstile CAPTCHA -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
