<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="siteTitle">Loading...</title>
  <meta name="description" content="Professional business website" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* Default Theme (Modern Clean) */
      --color-bg: #0a0a0f;
      --color-surface: rgba(255, 255, 255, 0.03);
      --color-card: rgba(255, 255, 255, 0.06);
      --color-text: #f8fafc;
      --color-muted: #94a3b8;
      --color-primary: #6366f1;
      --color-primary-light: #818cf8;

      --radius: 20px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);

      --spacing-md: 20px;
      --spacing-lg: 32px;
      --spacing-xl: 48px;
      --spacing-2xl: 96px;
      /* Increased for breathing room */

      --font-display: 'Inter', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      font-size: 16px;
    }

    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Animations */
    @media (prefers-reduced-motion: no-preference) {
      .reveal-on-scroll {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.8s ease-out, transform 0.8s ease-out;
      }

      .reveal-on-scroll.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .stagger-delay-1 {
        transition-delay: 0.1s;
      }

      .stagger-delay-2 {
        transition-delay: 0.2s;
      }

      .stagger-delay-3 {
        transition-delay: 0.3s;
      }
    }

    /* Header */
    header {
      padding: 24px 0;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-text);
      letter-spacing: -0.02em;
    }

    .logo span {
      color: var(--color-primary-light);
    }

    nav {
      display: flex;
      gap: 32px;
    }

    nav a {
      color: var(--color-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--color-primary-light);
    }

    /* Hero */
    .hero {
      padding: var(--spacing-2xl) 0;
      position: relative;
      overflow: hidden;
    }

    /* Background blob effect */
    .hero::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw;
      height: 80vh;
      background: radial-gradient(circle, var(--color-primary) 0%, transparent 70%);
      opacity: 0.1;
      filter: blur(100px);
      z-index: -1;
      pointer-events: none;
    }

    .hero-content {
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Split Layout Variant */
    .hero.layout-split .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
      text-align: left;
    }

    .hero.layout-split .hero-content {
      text-align: left;
      margin: 0;
    }

    .hero-image-container {
      display: none;
      /* Hidden by default */
    }

    .hero.layout-split .hero-image-container {
      display: block;
      position: relative;
    }

    .hero-image {
      width: 100%;
      border-radius: var(--radius);
      box-shadow: var(--shadow-2xl);
    }

    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(3rem, 5vw, 4.5rem);
      /* Responsive fluid typography */
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 24px;
      letter-spacing: -0.03em;

      /* Gradient text */
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1.25rem;
      color: var(--color-muted);
      max-width: 600px;
      margin: 0 auto 32px;
      line-height: 1.7;
    }

    .hero.layout-split p {
      margin-left: 0;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      padding: 16px 32px;
      background: var(--color-primary);
      color: white;
      text-decoration: none;
      border-radius: var(--radius);
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-glow);
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px -5px var(--color-primary);
      filter: brightness(1.1);
    }

    .cta-button.secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }

    .cta-button.secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: #fff;
    }

    /* Services/Products Cards */
    .services {
      padding: var(--spacing-2xl) 0;
    }

    .services h2 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3rem);
      text-align: center;
      margin-bottom: var(--spacing-md);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .section-subtitle {
      text-align: center;
      color: var(--color-muted);
      font-size: 1.1rem;
      margin-bottom: var(--spacing-xl);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 32px;
    }

    .service-card {
      background: var(--color-card);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius);
      padding: 32px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    /* Glassmorphism gradient overlay on hover */
    .service-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.05), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .service-card:hover {
      transform: translateY(-8px);
      border-color: var(--color-primary);
      box-shadow: var(--shadow-lg);
    }

    .service-card:hover::after {
      opacity: 1;
    }

    .service-card h3 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: var(--color-text);
      font-weight: 700;
    }

    .service-card p {
      color: var(--color-muted);
      margin-bottom: 24px;
      line-height: 1.7;
    }

    .service-price {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-primary-light);
      display: inline-block;
      padding: 8px 16px;
      background: rgba(99, 102, 241, 0.1);
      border-radius: 100px;
    }

    /* Contact */
    .contact {
      padding: var(--spacing-2xl) 0;
      color: var(--color-muted);
      margin: 12px 0;
    }

    .contact-info a {
      color: var(--color-primary-light);
      text-decoration: none;
    }

    footer {
      padding: 24px 0;
      text-align: center;
      color: var(--color-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Loading state */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-size: 1.5rem;
      color: var(--color-muted);
    }

    /* Shopping cart */
    .cart-button {
      position: relative;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 1rem;
      margin-left: 12px;
    }

    .cart-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ef4444;
      color: white;
      border-radius: 999px;
      min-width: 20px;
      height: 20px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .add-to-cart-btn {
      margin-top: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--color-text);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      width: 100%;
    }

    .add-to-cart-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .cart-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
    }

    .cart-modal.open {
      display: block;
    }

    .cart-modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
    }

    .cart-modal-content {
      position: absolute;
      top: 0;
      right: 0;
      width: min(420px, 100%);
      height: 100%;
      background: #111827;
      color: white;
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.35);
    }

    .cart-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cart-modal-close {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .cart-item-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .cart-qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .cart-modal-footer {
      padding: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .btn-checkout {
      width: 100%;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .cart-notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      z-index: 1100;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .cart-notification.show {
      opacity: 1;
      transform: translateY(0);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>

<body>
  <div id="loading" class="loading">
    <div class="loading-spinner"></div>
    <div>Loading your site...</div>
  </div>

  <div id="siteContent" style="display: none;">
    <header>
      <div class="container">
        <div class="header-content">
          <div class="logo" id="brandName" data-editable="brand.name"></div>
          <div class="header-actions">
            <nav id="nav"></nav>
            <div id="cartButtonContainer"></div>
          </div>
        </div>
      </div>
    </header>

    <section class="hero reveal-on-scroll">
      <div class="container">
        <div class="hero-content">
          <h1 id="heroTitle" data-editable="hero.title"></h1>
          <p id="heroSubtitle" data-editable="hero.subtitle"></p>
          <a href="#contact" class="cta-button" id="heroCTA" data-editable="hero.cta"></a>
        </div>

        <div class="hero-image-container">
          <img id="heroImage" src="" alt="" class="hero-image" />
        </div>
      </div>
    </section>

    <!-- Dynamic sections will be injected here -->
    <div id="dynamicSections"></div>

    <section class="services">
      <div class="container">
        <h2 id="servicesTitle" data-editable="services.title"></h2>
        <div class="services-grid" id="servicesGrid"></div>
      </div>
    </section>

    <section class="contact" id="contact">
      <div class="container">
        <h2>Contact Us</h2>
        <div class="contact-info" id="contactInfo"></div>

        <form id="contact-form" class="contact-form"
          style="max-width: 600px; margin: 32px auto; display: grid; gap: 16px;">
          <div>
            <label for="name" style="display: block; margin-bottom: 8px;">Name</label>
            <input type="text" id="name" name="name" required
              style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white;">
          </div>
          <div>
            <label for="email" style="display: block; margin-bottom: 8px;">Email</label>
            <input type="email" id="email" name="email" required
              style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white;">
          </div>
          <div>
            <label for="phone" style="display: block; margin-bottom: 8px;">Phone (Optional)</label>
            <input type="tel" id="phone" name="phone"
              style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white;">
          </div>
          <div>
            <label for="message" style="display: block; margin-bottom: 8px;">Message</label>
            <textarea id="message" name="message" required rows="5"
              style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white;"></textarea>
          </div>
          <button type="submit" class="cta-button" style="border: none; cursor: pointer; width: 100%;">Send
            Message</button>
          <div class="success-message" style="display: none; color: #4ade80; text-align: center; margin-top: 16px;">Your
            message has been sent successfully!</div>
          <div class="error-message" style="display: none; color: #f87171; text-align: center; margin-top: 16px;">Failed
            to send message. Please try again.</div>
        </form>
      </div>
    </section>

    <footer>
      <div class="container">
        <p id="footerText"></p>
      </div>
    </footer>
  </div>

  <div id="siteCartModal" class="cart-modal" data-testid="cart-modal" aria-hidden="true">
    <div class="cart-modal-overlay" data-testid="cart-overlay"></div>
    <div class="cart-modal-content">
      <div class="cart-modal-header">
        <h3>Shopping Cart</h3>
        <button type="button" class="cart-modal-close" data-testid="close-cart-btn" aria-label="Close cart">×</button>
      </div>
      <div class="cart-items-list" id="cartItemsList" data-testid="cart-items-container"></div>
      <div class="cart-modal-footer" id="cartModalFooter" style="display:none;">
        <div class="cart-total-row">
          <span>Total:</span>
          <span id="cartTotalAmount" data-testid="cart-total-amount">$0.00</span>
        </div>
        <button type="button" class="btn-checkout" id="cartCheckoutBtn" data-testid="checkout-btn">Proceed to Checkout</button>
      </div>
    </div>
  </div>

  <script>
    let siteData = null; // Store globally for editor access
    let siteCart = [];
    let checkoutEnabled = false;
    let currentSiteId = null;

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function safeHref(href) {
      const raw = String(href ?? '').trim();
      if (!raw) return '#';
      if (raw.startsWith('#') || raw.startsWith('/') || raw.startsWith('mailto:') || raw.startsWith('tel:')) {
        return escapeHtml(raw);
      }
      try {
        const u = new URL(raw, window.location.origin);
        if (u.protocol === 'http:' || u.protocol === 'https:') return escapeHtml(u.href);
      } catch { /* ignore */ }
      return '#';
    }

    function getSiteIdFromPath() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const sitesIndex = parts.indexOf('sites');
      if (sitesIndex >= 0 && parts[sitesIndex + 1]) {
        return parts[sitesIndex + 1];
      }
      return null;
    }

    function formatMoney(amount) {
      return `$${Number(amount || 0).toFixed(2)}`;
    }

    function showCartToast(message) {
      const toast = document.createElement('div');
      toast.className = 'cart-notification';
      toast.textContent = message;
      document.body.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 250);
      }, 2000);
    }

    function updateCartBadge() {
      const count = siteCart.reduce((sum, item) => sum + item.quantity, 0);
      const badge = document.querySelector('.cart-badge');
      if (!badge) return;
      badge.textContent = String(count);
      badge.style.display = count > 0 ? 'flex' : 'none';
    }

    function renderCartModal() {
      const list = document.getElementById('cartItemsList');
      const footer = document.getElementById('cartModalFooter');
      const totalEl = document.getElementById('cartTotalAmount');
      if (!list || !footer || !totalEl) return;

      if (siteCart.length === 0) {
        list.innerHTML = '<p class="cart-empty" data-testid="cart-empty">Your cart is empty</p>';
        footer.style.display = 'none';
        return;
      }

      list.innerHTML = siteCart.map(item => `
        <div class="cart-item-row" data-testid="cart-item-${item.id}">
          <div>
            <strong data-testid="cart-item-name">${item.name}</strong>
            <div>${formatMoney(item.price)} each</div>
            <div class="cart-item-controls">
              <button type="button" class="cart-qty-btn" data-action="decrease" data-id="${item.id}" data-testid="decrease-quantity">-</button>
              <span data-testid="quantity-value">${item.quantity}</span>
              <button type="button" class="cart-qty-btn" data-action="increase" data-id="${item.id}" data-testid="increase-quantity">+</button>
              <button type="button" class="cart-qty-btn" data-action="remove" data-id="${item.id}" data-testid="remove-item">Remove</button>
            </div>
          </div>
          <div>${formatMoney(item.price * item.quantity)}</div>
        </div>
      `).join('');

      const total = siteCart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      totalEl.textContent = formatMoney(total);
      footer.style.display = 'block';

      list.querySelectorAll('.cart-qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const action = btn.getAttribute('data-action');
          const item = siteCart.find(i => i.id === id);
          if (!item) return;

          if (action === 'remove' || (action === 'decrease' && item.quantity <= 1)) {
            siteCart = siteCart.filter(i => i.id !== id);
          } else if (action === 'decrease') {
            item.quantity -= 1;
          } else if (action === 'increase') {
            item.quantity += 1;
          }

          updateCartBadge();
          renderCartModal();
        });
      });
    }

    function openCartModal() {
      const modal = document.getElementById('siteCartModal');
      if (!modal) return;
      renderCartModal();
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeCartModal() {
      const modal = document.getElementById('siteCartModal');
      if (!modal) return;
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    }

    function addProductToCart(product) {
      if (!checkoutEnabled || product.price == null) return;
      const existing = siteCart.find(item => item.id === product.id);
      if (existing) {
        existing.quantity += 1;
      } else {
        siteCart.push({ ...product, quantity: 1 });
      }
      updateCartBadge();
      showCartToast(`Added "${product.name}" to cart`);
    }

    function buildAddToCartButton(product) {
      if (!checkoutEnabled || product.price == null) return '';
      return `<button type="button" class="add-to-cart-btn btn-add-to-cart" data-testid="add-to-cart-btn"
        data-product-id="${product.id}"
        data-product-name="${String(product.name || '').replace(/"/g, '&quot;')}"
        data-product-price="${product.price}"
        data-product-image="${product.image || ''}">🛒 Add to Cart</button>`;
    }

    function attachAddToCartHandlers(root = document) {
      root.querySelectorAll('.add-to-cart-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          addProductToCart({
            id: btn.getAttribute('data-product-id'),
            name: btn.getAttribute('data-product-name'),
            price: Number(btn.getAttribute('data-product-price')),
            image: btn.getAttribute('data-product-image') || ''
          });
        });
      });
    }

    function initializeSiteCart(data) {
      checkoutEnabled = data.settings?.allowCheckout === true
        || data.features?.stripeCheckout === true;
      currentSiteId = getSiteIdFromPath() || data.id || null;

      const container = document.getElementById('cartButtonContainer');
      if (!container) return;

      container.innerHTML = '';
      if (!checkoutEnabled) return;

      const cartBtn = document.createElement('button');
      cartBtn.type = 'button';
      cartBtn.className = 'cart-button';
      cartBtn.setAttribute('data-testid', 'cart-toggle');
      cartBtn.innerHTML = '🛒 <span class="cart-badge" data-testid="cart-badge">0</span>';
      cartBtn.addEventListener('click', openCartModal);
      container.appendChild(cartBtn);

      document.querySelector('.cart-modal-close')?.addEventListener('click', closeCartModal);
      document.querySelector('.cart-modal-overlay')?.addEventListener('click', closeCartModal);
      document.getElementById('cartCheckoutBtn')?.addEventListener('click', initiateSiteCheckout);

      updateCartBadge();
    }

    async function initiateSiteCheckout() {
      if (siteCart.length === 0) {
        alert('Your cart is empty');
        return;
      }

      const siteId = currentSiteId || getSiteIdFromPath();
      if (!siteId) {
        alert('Site ID not found. Please refresh and try again.');
        return;
      }

      try {
        const response = await fetch('/api/stripe/connect/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            siteId,
            items: siteCart.map(item => ({
              id: item.id,
              name: item.name,
              price: item.price,
              quantity: item.quantity,
              image: item.image || ''
            })),
            captchaToken: ''
          })
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.message || payload.error || 'Failed to create checkout session');
        }

        const checkoutUrl = payload.data?.url || payload.url;
        if (checkoutUrl) {
          window.location.href = checkoutUrl;
          return;
        }

        throw new Error('No checkout URL returned');
      } catch (error) {
        alert(`Checkout failed: ${error.message}`);
      }
    }

    function flattenMenuToProducts(menu) {
      if (!menu?.sections?.length) return [];
      const products = [];
      menu.sections.forEach(section => {
        (section.items || []).forEach((item, idx) => {
          if (item.price == null) return;
          const sectionKey = (section.id || section.name || 'menu').toLowerCase().replace(/[^a-z0-9]+/g, '-');
          products.push({
            id: item.id || `${sectionKey}-${idx}-${String(item.name || 'item').toLowerCase().replace(/[^a-z0-9]+/g, '-')}`,
            name: item.name,
            price: item.price,
            description: item.description || '',
            image: item.image || '',
            category: section.name || 'Menu'
          });
        });
      });
      return products;
    }

    async function loadSite() {
      try {
        const response = await fetch('./data/site.json');
        const data = await response.json();
        siteData = data; // Store for editor
        checkoutEnabled = data.settings?.allowCheckout === true
          || data.features?.stripeCheckout === true;
        currentSiteId = getSiteIdFromPath() || data.id || null;

        // Set title
        document.title = data.brand?.name || 'My Business';
        document.getElementById('siteTitle').textContent = data.brand?.name || 'My Business';

        // Set brand
        document.getElementById('brandName').textContent = data.brand?.name || 'My Business';

        // Set navigation
        const nav = document.getElementById('nav');
        if (data.nav && data.nav.length > 0) {
          nav.innerHTML = data.nav.map(item =>
            `<a href="${safeHref(item.href)}">${escapeHtml(item.label)}</a>`
          ).join('');
        }

        // Set hero
        // Set hero
        document.getElementById('heroTitle').textContent = data.hero?.title || 'Welcome';
        document.getElementById('heroSubtitle').textContent = data.hero?.subtitle || 'Learn more about our services';

        const ctaText = data.hero?.cta?.[0]?.label || data.hero?.cta || 'Get Started';
        const ctaBtn = document.getElementById('heroCTA');
        ctaBtn.textContent = ctaText;

        // Handle Split Layout
        if (data.hero?.layout === 'split') {
          document.querySelector('.hero').classList.add('layout-split');
          const heroImage = document.getElementById('heroImage');
          if (data.hero?.image && heroImage) {
            heroImage.src = data.hero.image;
            heroImage.alt = data.hero.imageAlt || 'Hero image';
            document.querySelector('.hero-image-container').style.display = 'block';
          }
        }

        // Render dynamic sections (Pro features)
        renderDynamicSections(data);

        // Initialize scroll animations after rendering
        setTimeout(initAnimations, 100);

        // Set services / products
        const servicesTitle = data.services?.title || (data.products?.length ? 'Our Products' : 'Our Services');
        document.getElementById('servicesTitle').textContent = servicesTitle;

        const menuProducts = flattenMenuToProducts(data.menu);
        const items = data.services?.items || data.products || menuProducts || [];
        const grid = document.getElementById('servicesGrid');
        grid.innerHTML = items.map((item, index) => {
          const product = {
            id: item.id || `service-${index}-${String(item.title || item.name || 'item').toLowerCase().replace(/[^a-z0-9]+/g, '-')}`,
            name: item.title || item.name,
            price: item.price,
            description: item.description || '',
            image: item.image || ''
          };
          return `
          <div class="service-card" data-editable-card="services.items.${index}">
            <h3 data-editable="services.items.${index}.title">${escapeHtml(product.name)}</h3>
            <p data-editable="services.items.${index}.description">${escapeHtml(product.description || '')}</p>
            ${product.price != null ? `<div class="service-price" data-editable="services.items.${index}.price">$${escapeHtml(product.price)}</div>` : ''}
            ${buildAddToCartButton(product)}
          </div>`;
        }).join('');

        attachAddToCartHandlers(grid);
        initializeSiteCart(data);

        // Set contact
        const contact = data.contact || {};
        const contactInfo = document.getElementById('contactInfo');
        contactInfo.innerHTML = `
          ${contact.email ? `<p data-editable="contact.email">Email: <a href="mailto:${escapeHtml(contact.email)}">${escapeHtml(contact.email)}</a></p>` : ''}
          ${contact.phone ? `<p data-editable="contact.phone">Phone: <a href="tel:${escapeHtml(contact.phone)}">${escapeHtml(contact.phone)}</a></p>` : ''}
          ${contact.address ? `<p data-editable="contact.address">${escapeHtml(contact.address)}</p>` : ''}
        `;

        // Set footer
        document.getElementById('footerText').textContent = `© ${new Date().getFullYear()} ${data.brand?.name || 'My Business'}. All rights reserved.`;

        // Show content
        document.getElementById('loading').style.display = 'none';
        document.getElementById('siteContent').style.display = 'block';

        // Check if in edit mode
        checkEditMode();

      } catch (error) {
        console.error('Error loading site:', error);
        document.getElementById('loading').textContent = 'Error loading site. Please contact support.';
      }
    }

      if (data.chefSpecials?.items) {
        sectionsHTML += `
          <section class="services" style="background: var(--color-surface);">
            <div class="container">
              <h2>${data.chefSpecials.title || "Chef's Specials"}</h2>
              ${data.chefSpecials.subtitle ? `<p style="text-align: center; color: var(--color-muted); margin-bottom: 32px;">${data.chefSpecials.subtitle}</p>` : ''}
              <div class="services-grid">
                ${data.chefSpecials.items.map(item => `
                  <div class="service-card">
                    ${item.image ? `<img src="${item.image}" alt="${item.name}" style="width: 100%; height: 200px; object-fit: cover; border-radius: var(--radius); margin-bottom: 16px;"/>` : ''}
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                      <h3>${item.name}</h3>
                      <span class="service-price">$${item.price}</span>
                    </div>
                    <p>${item.description || ''}</p>

                  </div>
                `).join('')}
              </div>
            </div>
          </section>
        `;
      }

      // Private Events
      if (data.privateEvents?.rooms) {
        sectionsHTML += `
          <section class="services" id="private">
            <div class="container">
              <h2>${data.privateEvents.title || 'Private Events'}</h2>
              ${data.privateEvents.subtitle ? `<p style="text-align: center; max-width: 800px; margin: 0 auto 32px; color: var(--color-muted);">${data.privateEvents.subtitle}</p>` : ''}
              <div class="services-grid">
                ${data.privateEvents.rooms.map(room => `
                  <div class="service-card">
                    ${room.image ? `<img src="${room.image}" alt="${room.name}" style="width: 100%; height: 200px; object-fit: cover; border-radius: var(--radius); margin-bottom: 16px;"/>` : ''}
                    <h3>${room.name}</h3>

                    <p>${room.description || ''}</p>

      if (data.gallery?.categories) {

          <section class="services" style="background: var(--color-surface);" id="gallery">

                  <div class="service-card" style="text-align: center;">

      // Testimonials
      if (data.testimonials?.items) {
        sectionsHTML += `
          <section class="services" style="background: var(--color-surface);">
            <div class="container">
              <h2>${data.testimonials.title || 'Testimonials'}</h2>
              ${data.testimonials.subtitle ? `<p style="text-align: center; color: var(--color-muted); margin-bottom: 32px;">${data.testimonials.subtitle}</p>` : ''}
              <div class="services-grid">

                    <p style="font-weight: 600;">${escapeHtml(t.author)}</p>

      // Stats
      if (data.stats?.items) {
        sectionsHTML += `
          <section class="services">
            <div class="container">
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 32px; text-align: center;">

                  <div>

      // FAQ
      if (data.faq?.items) {

                  <div style="margin-bottom: 24px; padding: 24px; background: var(--color-card); border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.1);">

      dynamicContainer.innerHTML = sectionsHTML;
      attachAddToCartHandlers(dynamicContainer);
    }

    // Auto-detect and load edit mode
    async function checkEditMode() {
      const params = new URLSearchParams(window.location.search);
      const editMode = params.get('edit');
      const token = params.get('token') || localStorage.getItem('authToken');

      if (editMode === 'true' && token) {
        // Verify token is valid
        try {
          const authCheck = await fetch('/api/auth/verify', {
            headers: { 'Authorization': `Bearer ${token}` }
          });

          if (authCheck.ok) {
            // Load visual editor
            const script = document.createElement('script');
            script.src = '/visual-editor.js';
            script.dataset.token = token;
            script.dataset.subdomain = window.location.pathname.split('/')[2];
            document.body.appendChild(script);

            // Store token in localStorage for future
            localStorage.setItem('authToken', token);
          } else {
            console.warn('Authentication failed, edit mode disabled');
          }
        } catch (error) {
          console.error('Failed to verify authentication:', error);
        }
      }
    }

    // Load site data on page load
    loadSite();

    // Handle contact form submission
    document.getElementById('contact-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const submitBtn = form.querySelector('button[type="submit"]');
      const successMsg = form.querySelector('.success-message');
      const errorMsg = form.querySelector('.error-message');

      // Reset state
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      try {
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        // Get subdomain from URL
        const subdomain = window.location.pathname.split('/')[2];

        const response = await fetch('/api/submissions/contact', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            subdomain,
            ...data
          })
        });

        if (response.ok) {
          successMsg.style.display = 'block';
          form.reset();
        } else {
          throw new Error('Submission failed');
        }
      } catch (error) {
        console.error('Submission error:', error);
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
      }
    });
    // Analytics Tracking
    function trackPageView() {
      const url = window.location.href;
      // Trigger window.plausible if it exists (for tests or real implementation)
      if (window.plausible) {
        window.plausible('pageview', { u: url });
      }
      // Also support legacy or other trackers
      if (window.gtag) {
        window.gtag('event', 'page_view', { page_location: url });
      }
      // For debugging
      console.log('Analytics: Tracked page view', url);
    }

    // Track on initial load
    window.addEventListener('load', trackPageView);

    // Track on navigation (hash changes for single-page sites)
    window.addEventListener('hashchange', trackPageView);

    // Scroll Animation Observer
    function initAnimations() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            // Optional: stop observing once visible
            // observer.unobserve(entry.target);
          }
        });
      }, {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
      });

      // Observe all sections and cards
      document.querySelectorAll('section, .service-card').forEach((el, index) => {
        el.classList.add('reveal-on-scroll');
        // Add staggered delays for grid items
        if (el.classList.contains('service-card')) {
          const delay = (index % 3) + 1;
          el.classList.add(`stagger-delay-${delay}`);
        }
        observer.observe(el);
      });
    }

  </script>
