url: http://localhost:5173/login
goal: Multi-staff site owner (Luxe Beauty Studio / gallery-salon) can use every owner surface including team calendar, staff picker, services, and schedule
steps:
  - action: Login form ready
    wait_for: { text: Welcome Back, timeout: 20000 }

  - action: Enter gallery email
    fill: { testId: login-email, value: "gallery@sitesprintz.com", clear: true }

  - action: Enter gallery password
    fill: { testId: login-password, value: "GalleryDemo123!", clear: true }

  - action: Submit login
    click: { testId: login-submit }
    settle_ms: 3000

  - action: Dashboard loads
    wait_for: { url: /dashboard, timeout: 20000 }
    settle_ms: 1200
    code: |
      const t = await page.locator('body').innerText();
      if (!/Luxe Beauty Studio/i.test(t)) {
        throw new Error('Dashboard missing salon site: ' + t.slice(0, 280));
      }

  - action: Dismiss welcome if present
    code: |
      const dismiss = page.getByTestId('welcome-dismiss');
      if (await dismiss.count()) {
        await dismiss.click({ timeout: 4000 }).catch(() => {});
      } else {
        await page.keyboard.press('Escape').catch(() => {});
      }
    settle_ms: 400

  - action: Open Luxe Beauty Studio workspace
    code: |
      const card = page.locator('[data-testid="site-card"][data-subdomain="gallery-salon"]');
      if ((await card.count()) === 0) throw new Error('Missing gallery-salon site card');
      await card.getByTestId('manage-site-button').click();
    settle_ms: 1500

  - action: Multi-staff workspace overview
    wait_for: { selector: '[data-testid="site-dashboard"]', timeout: 15000 }
    settle_ms: 600
    code: |
      const t = await page.locator('body').innerText();
      if (!/Luxe Beauty Studio/i.test(t)) throw new Error('Salon workspace identity missing: ' + t.slice(0, 240));
      for (const id of ['site-nav-overview', 'site-nav-orders', 'site-nav-appointments', 'site-nav-products', 'site-nav-settings', 'site-nav-analytics']) {
        if ((await page.getByTestId(id).count()) === 0) throw new Error('Missing nav ' + id);
      }
      if ((await page.getByTestId('site-dashboard-view').count()) === 0) throw new Error('View site missing');
      if ((await page.getByTestId('site-dashboard-edit').count()) === 0) throw new Error('Edit site missing');

  - action: Share modal from workspace
    code: |
      const share = page.getByTestId('site-dashboard-share');
      if ((await share.count()) === 0) throw new Error('Share button missing on published salon site');
      await share.scrollIntoViewIfNeeded();
      await share.click();
      for (const id of ['share-whatsapp', 'share-instagram', 'share-tiktok', 'share-facebook', 'share-download-qr']) {
        if ((await page.getByTestId(id).count()) === 0) throw new Error('Share missing ' + id);
      }
      await page.keyboard.press('Escape').catch(() => {});
      await page.getByTestId('share-modal').waitFor({ state: 'detached', timeout: 5000 }).catch(async () => {
        const close = page.locator('.share-modal-close');
        if (await close.count()) await close.click();
      });
    settle_ms: 400
    wait_for: { selector: '[data-testid="share-whatsapp"]', timeout: 10000 }

  - action: Orders workspace
    code: |
      const nav = page.getByTestId('site-nav-orders');
      await nav.scrollIntoViewIfNeeded();
      await nav.click();
      if ((await page.getByTestId('site-overview').count()) > 0) {
        throw new Error('Still on overview after orders nav click');
      }
    settle_ms: 1200
    wait_for: { url: /\/orders(?:\?|$)/, timeout: 15000 }

  - action: Products workspace
    click: { testId: site-nav-products }
    settle_ms: 1500
    code: |
      const t = await page.locator('body').innerText();
      const ok = /Product|Catalog|Add|Import|No products/i.test(t);
      if (!ok) throw new Error('Unexpected products panel: ' + t.slice(0, 280));

  - action: Settings workspace
    click: { testId: site-nav-settings }
    settle_ms: 1200
    code: |
      const t = await page.locator('body').innerText();
      const ok = /Settings|Payment|Domain|Foundation|Account/i.test(t);
      if (!ok) throw new Error('Unexpected settings panel: ' + t.slice(0, 280));

  - action: Analytics workspace
    click: { testId: site-nav-analytics }
    settle_ms: 1500
    code: |
      const t = await page.locator('body').innerText();
      const ok = /Analytic|Views|Visitor|Growth|Upgrade|Performance/i.test(t);
      if (!ok) throw new Error('Unexpected analytics panel: ' + t.slice(0, 280));

  - action: Appointments workspace with booking console
    code: |
      const nav = page.getByTestId('site-nav-appointments');
      await nav.scrollIntoViewIfNeeded();
      await nav.click();
      await page.waitForTimeout(1000);
      if ((await page.getByTestId('site-overview').count()) > 0) {
        throw new Error('Still on overview after appointments nav click');
      }
      const tab = page.getByTestId('appointments-tab');
      const add = page.getByTestId('add-service-button');
      if ((await tab.count()) === 0 && (await add.count()) === 0) {
        const t = await page.locator('body').innerText();
        throw new Error('Booking console not in appointments workspace: ' + t.slice(0, 280));
      }
      if (/Upgrade to Pro/i.test(await page.locator('body').innerText()) && (await tab.count()) === 0) {
        throw new Error('Growth salon owner hit a Pro wall');
      }
    settle_ms: 800
    wait_for: { url: /\/appointments(?:\?|$)/, timeout: 15000 }

  - action: Appointments tab
    code: |
      const tab = page.getByTestId('appointments-tab');
      if (await tab.count()) await tab.click({ timeout: 8000 });
      await page.waitForTimeout(800);
      const t = await page.locator('body').innerText();
      if (!/Appointment|No appointments|pending|confirmed|Booking/i.test(t)) {
        throw new Error('Appointments tab empty/unexpected: ' + t.slice(0, 240));
      }

  - action: Team calendar tab
    code: |
      const tab = page.getByTestId('calendar-board-tab');
      if ((await tab.count()) === 0) throw new Error('Team calendar tab missing');
      await tab.click({ timeout: 8000 });
      await page.waitForTimeout(1500);
      const board = (await page.getByTestId('team-calendar').count()) + (await page.getByTestId('schedule-board').count());
      if (!board) {
        const t = await page.locator('body').innerText();
        throw new Error('Team calendar/schedule board missing: ' + t.slice(0, 240));
      }
      const teamScope = page.getByTestId('schedule-scope-team');
      if (await teamScope.count()) await teamScope.click({ timeout: 4000 }).catch(() => {});

  - action: Team calendar week view
    code: |
      const week = page.getByTestId('schedule-view-week');
      if (await week.count()) await week.click({ timeout: 4000 });
      await page.waitForTimeout(600);
      if ((await page.getByTestId('schedule-board').count()) === 0 && (await page.getByTestId('team-calendar').count()) === 0) {
        throw new Error('Schedule board disappeared after week toggle');
      }

  - action: Services tab
    click: { testId: services-tab }
    settle_ms: 1200
    code: |
      const t = await page.locator('body').innerText();
      const add = await page.getByTestId('add-service-button').count();
      if (!add && !/Service|Add Service|duration|price/i.test(t)) {
        throw new Error('Services tab unexpected: ' + t.slice(0, 240));
      }

  - action: Availability schedule tab
    click: { testId: schedule-tab }
    settle_ms: 1200
    code: |
      const t = await page.locator('body').innerText();
      if (!/Schedule|Hours|Available|Monday|Availability/i.test(t)) {
        throw new Error('Schedule tab unexpected: ' + t.slice(0, 240));
      }

  - action: Phase 2 reminder settings
    code: |
      const tab = page.getByTestId('phase2-tab');
      if ((await tab.count()) === 0) throw new Error('Phase 2 tab missing');
      await tab.click({ timeout: 8000 });
      await page.waitForSelector('[data-testid="phase2-settings-panel"]', { timeout: 10000 });
      if ((await page.getByTestId('reminders-enabled-checkbox').count()) === 0) {
        throw new Error('Reminders checkbox missing');
      }
      if ((await page.getByTestId('save-phase2-settings-btn').count()) === 0) {
        throw new Error('Save phase 2 missing');
      }

  - action: Page builder for salon
    click: { testId: site-dashboard-builder }
    settle_ms: 2000
    code: |
      const t = await page.locator('body').innerText();
      const ok = /Quick Start|Page Builder|Preview|Sections|Luxe|Salon|Business essentials|What type of business/i.test(t);
      if (!ok) throw new Error('Unexpected salon editor: ' + t.slice(0, 300));

  - action: Account settings
    goto: http://localhost:5173/settings
    settle_ms: 1200
    wait_for: { text: Select a setting category from the sidebar, timeout: 15000 }
    assert:
      - text contains Payment Settings
      - text contains Custom Domain

  - action: Global analytics
    code: |
      await page.goto('http://localhost:5173/analytics', { waitUntil: 'domcontentloaded' });
      await page.waitForURL(/\/analytics/, { timeout: 15000 });
      await page.waitForTimeout(1200);
      const t = await page.locator('body').innerText();
      if (!/Analytic|TOTAL VIEWS|UNIQUE VISITORS|Performance|Views/i.test(t)) {
        throw new Error('Unexpected analytics: ' + t.slice(0, 240));
      }

  - action: Salon live site
    goto: http://localhost:5173/view/gallery-salon
    settle_ms: 2000
    wait_for: { text: Luxe Beauty Studio, timeout: 20000 }

  - action: Booking widget mounted
    wait_for: { selector: '[data-testid="live-booking-widget"]', timeout: 12000 }

  - action: Pick a service from the page catalog
    code: |
      const fromPage = page.locator('#services [data-ss-book-service]').first();
      if (await fromPage.count()) {
        await fromPage.click({ timeout: 8000 });
      } else {
        const widgetSvc = page.getByTestId('services-list').locator('button, [data-ss-book-service]').first();
        if (await widgetSvc.count()) await widgetSvc.click({ timeout: 8000 });
        else throw new Error('No bookable service on salon live site');
      }
    settle_ms: 800

  - action: Multi-staff picker is offered
    code: |
      await page.waitForTimeout(700);
      const staffStep = page.getByTestId('staff-selection-step');
      if ((await staffStep.count()) === 0) {
        const t = await page.locator('body').innerText();
        throw new Error('Expected staff picker on multi-staff salon: ' + t.slice(0, 280));
      }
      const named = page.locator('[data-testid^="staff-card-"]').filter({ hasNot: page.getByTestId('staff-card-no-preference') });
      if ((await named.count()) < 2) {
        throw new Error('Expected at least 2 named staff cards, got ' + (await named.count()));
      }
      if ((await page.getByTestId('staff-card-no-preference').count()) === 0) {
        throw new Error('Missing any-available stylist option');
      }
      await named.first().click({ timeout: 4000 });
    settle_ms: 600

  - action: Calendar slots reachable after staff pick
    code: |
      const slots = page.locator('[data-testid^="slot-"], [data-testid="time-slot"], button').filter({ hasText: /AM|PM|:/ });
      const calendar = page.getByTestId('booking-calendar');
      const t = await page.locator('[data-testid="live-booking-widget"]').innerText().catch(() => '');
      const ok = (await slots.count()) > 0 || (await calendar.count()) > 0 || /Select a date|Available|No times|Choose/i.test(t);
      if (!ok) throw new Error('After staff pick, no calendar/slots: ' + t.slice(0, 240));
