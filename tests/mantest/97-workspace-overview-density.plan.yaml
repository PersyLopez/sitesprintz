url: http://localhost:5173/login
goal: Site workspace overview cards stay compact while preserving the overview surface
steps:
  - action: Login form ready
    wait_for: { text: Welcome Back, timeout: 20000 }

  - action: Enter owner credentials
    fill: { testId: login-email, value: "test@example.com" }

  - action: Enter owner password
    fill: { testId: login-password, value: "SecurePass!2024" }

  - action: Submit login
    click: { testId: login-submit }
    settle_ms: 3000

  - action: Reach site workspace
    wait_for: { url: /dashboard, timeout: 20000 }
    code: |
      if ((await page.getByTestId('site-dashboard').count()) === 0) {
        const manage = page.getByTestId('manage-site-button').first();
        if ((await manage.count()) === 0) throw new Error('No site workspace or Manage button after login');
        await manage.click();
      }
      await page.getByTestId('site-overview').waitFor({ timeout: 15000 });
    settle_ms: 500

  - action: Overview cards remain compact
    code: |
      const overview = page.getByTestId('site-overview');
      if ((await overview.count()) === 0) throw new Error('Overview grid missing');
      const card = page.locator('.site-overview-card').first();
      const box = await card.boundingBox();
      if (!box) throw new Error('Overview card has no bounding box');
      if (box.height > 140) throw new Error('Overview card is too tall: ' + box.height);
