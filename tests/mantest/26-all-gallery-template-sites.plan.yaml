url: http://localhost:5173/view/gallery-salon
goal: Every seeded gallery template site renders identity, real sections, and no preview placeholders
steps:
  - action: Salon live site
    wait_for: { text: Luxe Beauty Studio, timeout: 20000 }
    settle_ms: 600
    code: |
      const t = await page.locator('body').innerText();
      if (/not yet supported in preview|Welcome to undefined|My Business/i.test(t)) {
        throw new Error('Salon site has placeholders: ' + t.slice(0, 280));
      }
      if (!/Book|Contact|Service/i.test(t)) {
        throw new Error('Salon missing expected sections: ' + t.slice(0, 280));
      }

  - action: Restaurant
    goto: http://localhost:5173/view/gallery-restaurant
    settle_ms: 1800
  - action: Restaurant identity
    wait_for: { text: The Grand Table, timeout: 20000 }
    code: |
      const t = await page.locator('body').innerText();
      if (/not yet supported in preview/i.test(t)) throw new Error('Restaurant placeholders');
      if (!/Menu|Hour|Contact|Order|Grand Table/i.test(t)) {
        throw new Error('Restaurant missing copy: ' + t.slice(0, 280));
      }

