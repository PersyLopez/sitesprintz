url: http://localhost:5173/about
goal: Public content pages About, Contact, Track, and 404 behave correctly
steps:
  - action: About page content
    wait_for: { text: About Right Site Light, timeout: 20000 }
    assert:
      - text contains Leave a light on for tomorrow’s customer
      - text contains Who we built this for
      - text contains How it works
      - text contains support@rightsitelight.com
    code: |
      const title = await page.title();
      if (title !== 'About Right Site Light') {
        throw new Error(`About title: ${title}`);
      }

  - action: Open Spanish about
    goto: "http://localhost:5173/about?lang=es"

  - action: Spanish about title
    code: |
      const heading = page.getByRole('heading', { name: 'Acerca de Right Site Light', level: 1 });
      await heading.waitFor({ timeout: 20000 });
      const title = await page.title();
      if (title !== 'Acerca de Right Site Light') {
        throw new Error(`Spanish about title: ${title} at ${page.url()}`);
      }

  - action: Go to Contact
    goto: "http://localhost:5173/contact?lang=en"

  - action: Contact loaded
    wait_for: { text: Contact, timeout: 20000 }
    assert:
      - text contains support@rightsitelight.com
      - text contains Common questions
    code: |
      const heading = (await page.locator('h1').innerText()).trim();
      const title = await page.title();
      if (title !== `${heading} — Right Site Light`) {
        throw new Error(`Contact title: ${title}`);
      }

  - action: Go to Track lookup
    goto: http://localhost:5173/track

  - action: Track loaded
    wait_for: { text: Track Your Order or Appointment, timeout: 20000 }
    assert:
      - text contains Order ID
      - text contains Email Address

  - action: Track form empty submit stays on page
    click: { role: button, name: Track }
    settle_ms: 600
    assert:
      - text contains Track Your Order or Appointment

  - action: Unknown route
    goto: http://localhost:5173/this-page-does-not-exist-xyz

  - action: 404 loaded
    wait_for: { text: Page Not Found, timeout: 20000 }
    assert:
      - text contains Page Not Found
      - text contains Go Home
    code: |
      const headings = await page.locator('main h1, main h2, main h3, main h4, main h5, main h6').all();
      const first = headings[0];
      const second = headings[1];
      if (!first || (await first.evaluate(el => el.tagName)) !== 'H1' || !(await first.textContent()).includes('Page Not Found')) {
        throw new Error('First 404 heading is not h1 Page Not Found');
      }
      if (!second || (await second.evaluate(el => el.tagName)) !== 'H2' || !(await second.textContent()).includes('Helpful Links')) {
        throw new Error('Second 404 heading is not h2 Helpful Links');
      }
