url: http://localhost:5173/login
goal: Embedded workspace Analytics stats stay compact without changing shared admin cards
steps:
  - action: Login form ready
    wait_for: { text: Welcome Back, timeout: 20000 }

  - action: Enter test owner credentials
    fill: { testId: login-email, value: "test@example.com", clear: true }

  - action: Enter test owner password
    fill: { testId: login-password, value: "SecurePass!2024", clear: true }

  - action: Submit login
    click: { testId: login-submit }
    settle_ms: 3000

  - action: Reach site workspace
    wait_for: { url: /dashboard, timeout: 20000 }
    code: |
      if ((await page.getByTestId('site-dashboard').count()) === 0) {
        const manage = page.getByTestId('manage-site-button').first();
        if ((await manage.count()) === 0) throw new Error('No site workspace or Manage button after login');
        await manage.click();
      }
      await page.getByTestId('site-dashboard').waitFor({ timeout: 15000 });
    settle_ms: 800

  - action: Open Analytics workspace tab
    click: { testId: site-nav-analytics }
    settle_ms: 1500

  - action: Analytics panel is compact
    wait_for: { selector: '[data-testid="workspace-analytics-panel"]', timeout: 15000 }
    code: |
      const panel = page.getByTestId('workspace-analytics-panel');
      const cards = panel.locator('.stats-card');
      if ((await cards.count()) > 0) {
        const height = await cards.first().evaluate((element) => element.getBoundingClientRect().height);
        if (height > 120) throw new Error(`Embedded stats card is ${height}px tall`);
      }
    settle_ms: 400
