url: http://localhost:5173/
goal: Landing CTAs and template marketing sections work
steps:
  - action: Dismiss setup offer modal if visible
    wait_for: { text: Get Your Page Free }
    code: |
      const dismiss = page.getByTestId('setup-offer-dismiss');
      if (await dismiss.isVisible()) {
        await dismiss.click({ timeout: 5000 });
        await page.waitForTimeout(400);
      }
    assert:
      - text contains Get Your Page Free

  - action: Hero primary CTA goes to register
    wait_for: { text: Get Your Page Free }
    click: { text: Get Your Page Free → }
    settle_ms: 1000
    assert:
      - url contains /register

  - action: Back to landing
    goto: http://localhost:5173/
    wait_for: { text: They love what you make }

  - action: Dismiss setup offer modal if visible
    code: |
      const dismiss = page.getByTestId('setup-offer-dismiss');
      if (await dismiss.isVisible()) {
        await dismiss.click({ timeout: 5000 });
        await page.waitForTimeout(400);
      }

  - action: View Gallery secondary CTA
    click: { text: Browse example sites → }
    settle_ms: 1000
    assert:
      - url contains /showcase

  - action: Landing templates section
    goto: http://localhost:5173/
    wait_for: { text: A layout that already feels like your business }
    assert:
      - text contains Restaurant
      - text contains Salon & Spa
      - text contains Fitness & Gym
      - text contains How it works
      - text contains Tell us what you sell
      - text contains Show what customers need
      - text contains Share your link
      - text contains Get Your Page Free

  - action: Showcase guest CTA matches header and hero
    code: |
      await page.goto('http://localhost:5173/showcase', { waitUntil: 'domcontentloaded' });
      await page.getByTestId('nav-get-started').waitFor({ state: 'visible', timeout: 10000 });
      await page.locator('body').getByText('Get Your Page Free', { exact: true }).first().waitFor({
        state: 'visible',
        timeout: 10000,
      });
    assert:
      - text contains Get Your Page Free

  - action: How it works nav
    click: { testId: nav-how-it-works }
    settle_ms: 600
    assert:
      - text contains Three steps. Then you’re findable.
    code: |
      if ((await page.locator('#purpose').count()) === 0) {
        await page.goto('http://localhost:5173/#how-it-works');
      }
      await page.locator('#purpose').waitFor({ state: 'attached', timeout: 10000 });
      await page.locator('#how-it-works').waitFor({ state: 'attached', timeout: 10000 });
      await page.locator('#templates').waitFor({ state: 'attached', timeout: 10000 });
      const order = await page.evaluate(() => {
        const purpose = document.querySelector('#purpose');
        const how = document.querySelector('#how-it-works');
        const templates = document.querySelector('#templates');
        const purposeBeforeHow = Boolean(
          purpose.compareDocumentPosition(how) & Node.DOCUMENT_POSITION_FOLLOWING
        );
        const howBeforeTemplates = Boolean(
          how.compareDocumentPosition(templates) & Node.DOCUMENT_POSITION_FOLLOWING
        );
        const step3 = how.querySelectorAll('.how-arc-step')[2];
        const step3Text = step3 ? step3.textContent || '' : '';
        return { purposeBeforeHow, howBeforeTemplates, step3Text };
      });
      if (!order.purposeBeforeHow || !order.howBeforeTemplates) {
        throw new Error(`Section order wrong: ${JSON.stringify(order)}`);
      }
      if (!/Instagram|Facebook/.test(order.step3Text)) {
        throw new Error(`How step 3 is WhatsApp-only: ${order.step3Text}`);
      }
