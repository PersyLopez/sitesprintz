url: http://localhost:5173/view/plants-and-threads
goal: Plants & Threads live site is bilingual, hides Walnut Avenue, pay-on-site shopping, and sewing slots work
steps:
  - action: English live site loads
    wait_for: { text: Plants & Threads, timeout: 20000 }
    settle_ms: 800

  - action: Four hibiscus photos from the grid are $20 products
    wait_for: { text: Orange hibiscus, timeout: 8000 }
    code: |
      const t = await page.locator('[data-testid="published-composed-site"]').innerText();
      for (const name of ['Orange hibiscus', 'Pink hibiscus', 'Coral hibiscus', 'Apricot hibiscus']) {
        if (!t.includes(name)) throw new Error('Missing product: ' + name);
      }
      if (!/\$20/.test(t)) throw new Error('Missing $20 price');


  - action: Street is not public
    code: |
      const t = await page.locator('[data-testid="published-composed-site"]').innerText();
      if (/Walnut/i.test(t) || /429/.test(t)) {
        throw new Error('Private street leaked: ' + t.slice(0, 400));
      }
      if (!/Trenton/i.test(t)) {
        throw new Error('Public city missing: ' + t.slice(0, 400));
      }

  - action: EN and ES switcher is on the live nav
    wait_for: { selector: '[data-testid="language-switcher"]', timeout: 8000 }

  - action: Switch to Spanish
    click: { testId: language-switcher-es }
    settle_ms: 800

  - action: Spanish copy is visible
    wait_for: { text: Plantas, timeout: 12000 }

  - action: Switch back to English
    click: { testId: language-switcher-en }
    settle_ms: 800

  - action: English copy returns
    wait_for: { text: Plants for sale, timeout: 12000 }

  - action: Cash is required without advertising card
    code: |
      const t = await page.locator('[data-testid="published-composed-site"]').innerText();
      if (/cash or card/i.test(t) || /cash or in person/i.test(t)) {
        throw new Error('Pay-on-site still mentions card: ' + t.slice(0, 400));
      }
      if (!/Please bring cash/i.test(t)) {
        throw new Error('Cash hint missing: ' + t.slice(0, 400));
      }

  - action: Add a plant to the cart
    click: { selector: '[data-ss-add-to-cart]' }
    settle_ms: 500

  - action: Open cart pay-on-site checkout
    click: { testId: cart-toggle-button }
    settle_ms: 600

  - action: Checkout note is a quiet cash hint
    wait_for: { selector: '[data-testid="pay-on-site-checkout"]', timeout: 8000 }
    code: |
      const t = await page.locator('[data-testid="pay-on-site-checkout"]').innerText();
      if (/cash or card/i.test(t) || /cash or in person/i.test(t)) {
        throw new Error('Checkout still says cash or card: ' + t);
      }
      if (!/Please bring cash/i.test(t)) {
        throw new Error('Checkout cash hint missing: ' + t);
      }

  - action: Close cart
    click: { testId: cart-close-button }
    settle_ms: 400

  - action: Sewing booking widget is mounted
    wait_for: { selector: '[data-testid="live-booking-widget"]', timeout: 10000 }

  - action: Sewing service is bookable
    code: |
      const body = await page.locator('body').innerText();
      if (!/Sewing/i.test(body)) throw new Error('Sewing service missing on live page');
      const err = await page.locator('[data-testid="error-message"]').count();
      if (err) throw new Error('Booking widget shows an error');

  - action: Pick sewing from the catalog or widget
    code: |
      const pageBook = page.locator('#services [data-ss-book-service], [data-ss-book-service]');
      const select = page.getByTestId('booking-service-select');
      const card = page.locator('[data-testid^="service-card-"]');
      if (await pageBook.count()) {
        await pageBook.filter({ hasText: /Sew/i }).first().click({ timeout: 8000 }).catch(async () => {
          await pageBook.first().click();
        });
      } else if (await select.count()) {
        const options = await select.locator('option').allTextContents();
        const sewing = options.find((o) => /Sew/i.test(o));
        if (sewing) await select.selectOption({ label: sewing });
        else if (options.length > 1) await select.selectOption({ index: 1 });
        const next = page.getByTestId('next-button');
        if (await next.count()) await next.first().click();
      } else if (await card.count()) {
        await card.first().click();
        const next = page.getByTestId('next-button');
        if (await next.count()) await next.first().click();
      } else {
        throw new Error('Plants & Threads has no bookable sewing control');
      }
    settle_ms: 800

  - action: Continue through optional staff step
    code: |
      const staffStep = page.getByTestId('staff-selection-step');
      if (await staffStep.count()) {
        const staffCards = page.locator('[data-testid^="staff-card-"]').filter({
          hasNot: page.getByTestId('staff-card-no-preference'),
        });
        if (await staffCards.count()) {
          await staffCards.first().click({ timeout: 3000 });
        } else {
          const noPref = page.getByTestId('staff-card-no-preference');
          if (await noPref.count()) await noPref.click({ timeout: 3000 });
        }
        const next = page.getByTestId('next-button').first();
        await next.waitFor({ timeout: 5000 });
        await next.click();
      }
    settle_ms: 800

  - action: Calendar is visible
    wait_for: { selector: '[data-testid="calendar"]', timeout: 12000 }

  - action: Pick a weekday and see sewing times
    code: |
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let picked = false;
      for (let offset = 1; offset <= 21; offset += 1) {
        const day = new Date(today);
        day.setDate(today.getDate() + offset);
        if (day.getDay() === 0 || day.getDay() === 6) continue;
        const iso = day.getFullYear() + '-' + String(day.getMonth() + 1).padStart(2, '0') + '-' + String(day.getDate()).padStart(2, '0');
        const btn = page.getByTestId('date-' + iso);
        if ((await btn.count()) === 0) {
          const nextMonth = page.getByTestId('next-month');
          if (await nextMonth.count()) {
            await nextMonth.click();
            await page.waitForTimeout(300);
          }
        }
        if ((await btn.count()) === 0 || !(await btn.isEnabled())) continue;
        await btn.click();
        const slots = page.locator('[data-testid^="time-slot-"]');
        const empty = page.getByTestId('slots-empty');
        const loading = page.getByText(/Finding available times/i);
        await Promise.race([
          slots.first().waitFor({ timeout: 10000 }).catch(() => {}),
          empty.waitFor({ timeout: 10000 }).catch(() => {}),
        ]);
        if (await loading.count()) {
          await loading.first().waitFor({ state: 'hidden', timeout: 8000 }).catch(() => {});
        }
        if ((await slots.count()) > 0) {
          await slots.first().click();
          picked = true;
          break;
        }
      }
      if (!picked) throw new Error('Sewing calendar had no weekday with times');
    settle_ms: 400

  - action: Continue to customer form
    click: { testId: next-button }
    settle_ms: 600

  - action: Customer form is visible
    wait_for: { selector: '[data-testid="customer-form"]', timeout: 8000 }
