url: http://localhost:5173/login
goal: Owner opens Messages in the site workspace and sees this site's contact submissions; opening one marks it read
steps:
  - action: Login form ready
    wait_for: { text: Welcome Back, timeout: 20000 }

  - action: Enter email
    fill: { testId: login-email, value: "test@example.com" }

  - action: Enter password
    fill: { testId: login-password, value: "SecurePass!2024" }

  - action: Submit login
    click: { testId: login-submit }
    settle_ms: 4000

  - action: Reach a site workspace
    code: |
      const url = page.url();
      if (!/\/dashboard\/sites\//.test(url)) {
        const manage = page.getByTestId('manage-site-button').first();
        if ((await manage.count()) === 0) {
          throw new Error('Not on a site workspace and no Manage button, at ' + url);
        }
        await manage.click();
      }
      await page.waitForURL((u) => /\/dashboard\/sites\//.test(u.pathname), { timeout: 20000 });
    settle_ms: 1500

  - action: Overview Messages card visible and linked
    code: |
      const card = page.getByTestId('site-overview-messages');
      await card.waitFor({ state: 'visible', timeout: 15000 });
      const href = await card.getAttribute('href');
      if (!href || !href.endsWith('/messages')) {
        throw new Error('Overview Messages card href does not end with /messages: ' + href);
      }

  - action: Open Messages nav
    click: { testId: site-nav-messages }
    wait_for: { text: Messages, timeout: 15000 }
    settle_ms: 1000

  - action: Seed a contact submission for this site
    code: |
      const h1 = page.locator('h1[title]').first();
      if ((await h1.count()) === 0) throw new Error('Workspace h1 with title attribute not found');
      const subdomain = await h1.getAttribute('title');
      if (!subdomain) throw new Error('Workspace h1 title attribute empty');
      const res = await page.evaluate(async (sub) => {
        const r = await fetch('/api/submissions/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subdomain: sub,
            name: 'Mantest Lead',
            email: 'lead@example.com',
            phone: '201-555-0123',
            message: 'Mantest lead'
          })
        });
        return r.json();
      }, subdomain);
      if (!res || res.demo !== true) {
        await page.reload();
        await page.getByTestId('site-inquiries').waitFor({ state: 'visible', timeout: 20000 });
      }
    settle_ms: 1200

  - action: Demo site shows empty state, non-demo shows the lead
    code: |
      if (await page.getByTestId('site-inquiries-empty').count()) return;
      const rows = page.getByTestId('site-inquiry-row');
      const text = await page.getByTestId('site-inquiries').innerText();
      if (!text.includes('Mantest lead')) {
        throw new Error('Seeded message not visible in Messages list');
      }
      const phone = page.getByTestId('site-inquiry-phone').filter({ hasText: '201-555-0123' });
      if ((await phone.count()) === 0) {
        throw new Error('Seeded phone is not visible on the message');
      }
    settle_ms: 400

  - action: Messages nav shows an unread count
    code: |
      if (await page.getByTestId('site-inquiries-empty').count()) return;
      const badge = page.getByTestId('site-nav-messages-unread');
      if ((await badge.count()) === 0) {
        throw new Error('Messages nav does not show an unread count for a seeded unread lead');
      }
      const text = (await badge.innerText()).trim();
      if (!/^\d+$/.test(text)) {
        throw new Error('Messages nav unread count is not a number: ' + text);
      }
      await page.evaluate((n) => { window.__mantestUnreadBefore = Number(n); }, text);
    settle_ms: 400

  - action: Opening the row marks it read
    code: |
      if (await page.getByTestId('site-inquiries-empty').count()) return;
      const row = page.getByTestId('site-inquiry-row').first();
      await row.click();
      await page.waitForTimeout(1000);
      const rowText = await page.getByTestId('site-inquiry-row').first().innerText();
      if (/\bNew\b/.test(rowText)) {
        throw new Error('Row still shows New after being opened');
      }
      const badge = page.getByTestId('site-nav-messages-unread');
      const count = (await badge.count()) ? Number((await badge.innerText()).trim()) : 0;
      const before = await page.evaluate(() => window.__mantestUnreadBefore ?? 0);
      if (count >= before) {
        throw new Error(`Messages nav unread count did not drop after opening a message (${before} -> ${count})`);
      }
    settle_ms: 400

  - action: Archive removes the seeded lead from the inbox
    code: |
      if (await page.getByTestId('site-inquiries-empty').count()) return;
      for (let i = 0; i < 10; i++) {
        const list = page.getByTestId('site-inquiries');
        if ((await list.count()) === 0) break;
        const text = await list.innerText();
        if (!text.includes('Mantest lead')) break;
        await page.getByTestId('site-inquiry-archive').first().click();
        await page.waitForTimeout(600);
      }
      const list = page.getByTestId('site-inquiries');
      const text = (await list.count()) ? await list.innerText() : '';
      if (text.includes('Mantest lead')) {
        throw new Error('Archived lead is still visible in the Messages list');
      }
    settle_ms: 400

  - action: Archived lead stays gone after reload
    code: |
      await page.reload();
      await page.getByTestId('site-inquiries-empty').or(page.getByTestId('site-inquiries')).first().waitFor({ state: 'visible', timeout: 20000 });
      if (await page.getByTestId('site-inquiries-empty').count()) return;
      const text = await page.getByTestId('site-inquiries').innerText();
      if (text.includes('Mantest lead')) {
        throw new Error('Archived lead reappeared in the Messages list after reload');
      }
    settle_ms: 400
