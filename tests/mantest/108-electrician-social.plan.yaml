url: http://localhost:5173/view/gallery-electrician
goal: Brightline Electric demo site renders no unowned social or Calendly links (QA C-06)
steps:
  - action: Page settled
    wait_for: { text: Brightline Electric, timeout: 30000 }
    settle_ms: 2000

  - action: No unowned social or booking links in page HTML
    code: |
      const html = await page.content();
      const forbidden = ['facebook.com/', 'calendly.com/'];
      for (const host of forbidden) {
        if (html.includes(host)) throw new Error('Forbidden link found on gallery-electrician: ' + host);
      }
