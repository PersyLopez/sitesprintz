url: http://localhost:5173/track
goal: Track lookup validation and contact page content without external messaging
steps:
  - action: Track page
    wait_for: { text: Track Your Order or Appointment, timeout: 20000 }
    assert:
      - text contains Order ID
      - text contains Email Address

  - action: Empty track submit stays local
    click: { role: button, name: Track }
    settle_ms: 600
    assert:
      - url contains /track
      - text contains Track Your Order or Appointment

  - action: Fill invalid tracking values
    code: |
      await page.locator('#referenceId').fill('definitely-not-a-real-order-xyz');
      await page.locator('#email').fill('nobody-invalid@example.com');
    settle_ms: 300

  - action: Submit invalid track
    click: { role: button, name: Track }
    settle_ms: 2000

  - action: Local track error or result route
    code: |
      // Accept: toast/error on /track, or navigation to /track/order|appointment result UI
      await page.waitForTimeout(500);
      const url = page.url();
      const t = await page.locator('body').innerText();
      const onLookup = url.match(/\/track\/?$/) || url.endsWith('/track');
      const onResult = /\/track\/(order|appointment)\//.test(url);
      const hasFeedback = /not found|invalid|unable|failed|error|try again|Please fill|Order|Loading order|order details|status/i.test(t);
      if (!(onLookup || onResult) || !hasFeedback) {
        throw new Error('Unexpected track result: ' + url + ' ' + t.slice(0, 250));
      }
    settle_ms: 300
  - action: Contact page static content
    goto: http://localhost:5173/contact

  - action: Contact loaded
    wait_for: { text: Contact, timeout: 15000 }
    assert:
      - text contains support@rightsitelight.com
      - text contains Common questions
      - text contains Get Your Page Free
