url: https://rightsitelight.com/claim/7d02c9223328ce0be43a386bd33e5a862ce3ca00f7901653329d283849ac378a
goal: Claim page tells them to use their own email, not a walk-in account
steps:
  - action: Claim page loads signed out
    wait_for: { selector: '[data-testid="claim-register"]', timeout: 20000 }
    settle_ms: 400

  - action: Copy says use the email they want the site under
    wait_for: { text: email you want this site owned under, timeout: 8000 }

  - action: Log in is also there
    wait_for: { selector: '[data-testid="claim-login"]', timeout: 5000 }
