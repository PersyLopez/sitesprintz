    assert:
      - url contains /login

  - action: Analytics requires auth
    goto: http://localhost:5173/analytics
    wait_for: { url: /login }
    assert:
      - url contains /login

  - action: Settings requires auth
    goto: http://localhost:5173/settings
    wait_for: { url: /login }
    assert:
      - url contains /login

  - action: Products requires auth
    goto: http://localhost:5173/products
    wait_for: { url: /login }
    assert:
      - url contains /login

  - action: Booking dashboard requires auth
    goto: http://localhost:5173/booking-dashboard
    wait_for: { url: /login }
    assert:
      - url contains /login

  - action: Admin requires auth
    goto: http://localhost:5173/admin
