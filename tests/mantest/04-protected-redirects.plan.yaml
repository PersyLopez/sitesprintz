url: http://localhost:5173/dashboard
goal: Unauthenticated users are redirected away from protected routes
steps:
  - action: Dashboard requires auth
    wait_for: { url: /login }
    settle_ms: 500
    assert:
      - url contains /login

  - action: Setup requires auth
    goto: http://localhost:5173/setup
    wait_for: { url: /login }
    assert:
      - url contains /login

  - action: Orders requires auth
    goto: http://localhost:5173/orders
