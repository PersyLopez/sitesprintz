url: http://localhost:5173/login
goal: Setup page builder after skip and template — rail, inspector, one live preview, save
steps:
  - action: Login form ready
    wait_for: { text: Welcome Back, timeout: 20000 }

  - action: Enter email
    fill: { testId: login-email, value: "test@example.com", clear: true }

  - action: Enter password
    fill: { testId: login-password, value: "SecurePass!2024", clear: true }

  - action: Submit login
    click: { testId: login-submit }
    settle_ms: 3000

  - action: Dashboard
    wait_for: { url: /dashboard, timeout: 20000 }
    settle_ms: 800

  - action: Dismiss welcome
    code: |
      const dismiss = page.getByTestId('welcome-dismiss');
      if (await dismiss.count()) await dismiss.click({ timeout: 4000 }).catch(() => {});
      else await page.keyboard.press('Escape').catch(() => {});
    settle_ms: 400

  - action: Open setup
    goto: http://localhost:5173/setup
    settle_ms: 1500

  - action: Quick Start present
    wait_for: { selector: '[data-testid="quickstart-wizard"]', timeout: 20000 }
    assert:
      - text contains Quick Start

  - action: Skip to Full Editor
    click: { testId: wizard-skip }
    settle_ms: 1500
    assert:
      - url contains /setup
      - text contains Publish

  - action: Skip-empty picker only
    wait_for: { selector: '[data-testid="template-grid"]', timeout: 15000 }
    settle_ms: 400
    assert:
      - text contains Templates
      - text contains Showing

  - action: Skip-empty layout probe
    code: |
      const publish = page.getByTestId('publish-site-button');
      if (!(await publish.isDisabled())) {
        throw new Error('Publish should be disabled with no template');
      }
      if (await page.getByTestId('customize-panel').isVisible()) {
        throw new Error('Editor column should not sit beside the template picker');
      }
      if (await page.getByTestId('page-builder').isVisible()) {
        throw new Error('Page builder should not show before a template');
      }
    settle_ms: 200

  - action: Use Salon template
    code: |
      const use = page.getByRole('button', { name: /Use Salon template/i });
      if ((await use.count()) === 0) throw new Error('Use Salon template button missing');
      await use.first().click({ timeout: 8000 });
    settle_ms: 2500

  - action: Page builder loads
    wait_for: { selector: '[data-testid="page-builder"]', timeout: 20000 }
    settle_ms: 800
    assert:
      - text contains Beauty Studio
      - text contains Look
      - text contains Add section

  - action: Live preview is not covered by a loader
    code: |
      const iframe = page.locator('[data-testid="preview-frame"] iframe');
      if (!(await iframe.isVisible())) throw new Error('Preview iframe missing after template');
      if (await page.getByTestId('preview-loading').isVisible()) {
        throw new Error('Loading overlay should not cover the live preview');
      }
    settle_ms: 200

  - action: Publish enabled after template
    code: |
      const publish = page.getByTestId('publish-site-button');
      if (await publish.isDisabled()) throw new Error('Publish still disabled after template');
    settle_ms: 200

  - action: Two columns after Salon
    wait_for: { selector: '[data-testid="preview-frame"]', timeout: 15000 }
    code: |
      const layout = await page.evaluate(() => {
        const builder = document.querySelector('[data-testid="page-builder"]');
        const iframe = document.querySelector('[data-testid="preview-frame"] iframe');
        const twoCol = !!document.querySelector('.setup-panels--two-col');
        const device = document.querySelector('[data-testid="device-desktop"]');
        return {
          twoCol,
          hasBuilder: !!builder,
          iframeW: iframe ? Math.round(iframe.getBoundingClientRect().width) : 0,
          iframeH: iframe ? Math.round(iframe.getBoundingClientRect().height) : 0,
          hasDevice: !!device,
        };
      });
      if (!layout.twoCol) throw new Error('Expected setup-panels--two-col after Salon');
      if (!layout.hasBuilder) throw new Error('Page builder missing');
      if (layout.hasDevice) throw new Error('Device preview chrome should be gone');
      if (layout.iframeW < 400) throw new Error('Preview iframe too narrow: ' + layout.iframeW);
      if (layout.iframeH < 200) throw new Error('Preview iframe too short: ' + layout.iframeH);
    settle_ms: 200

  - action: Preview contains salon copy
    code: |
      const frame = page.frameLocator('[data-testid="preview-frame"] iframe');
      const body = await frame.locator('body').innerText();
      if (!/Transform Your Look|Beauty Studio|Professional hair/i.test(body.slice(0, 800))) {
        throw new Error('Preview missing salon copy: ' + body.slice(0, 800));
      }
    settle_ms: 300

  - action: Open Look inspector
    click: { testId: builder-look }
    settle_ms: 800
    assert:
      - text contains Look

  - action: Theme picker visible
    code: |
      if ((await page.getByTestId('theme-picker').count()) === 0) {
        throw new Error('Theme picker missing after Look');
      }
    settle_ms: 200

  - action: Select services section
    click: { testId: section-type-services }
    settle_ms: 800

  - action: Services inspector
    wait_for: { selector: '[data-testid="builder-inspector"]', timeout: 8000 }
    code: |
      const kind = await page.getByTestId('builder-inspector').getAttribute('data-inspector');
      if (kind !== 'services') throw new Error('Expected services inspector, got ' + kind);
    settle_ms: 200

  - action: Open essentials via hero
    click: { testId: section-type-hero }
    settle_ms: 800

  - action: Change business name
    fill: { testId: business-name-input, value: "Mantest Beauty Co", clear: true }
    settle_ms: 800

  - action: Name field keeps the new value
    code: |
      const val = await page.getByTestId('business-name-input').inputValue();
      if (!/Mantest Beauty Co/i.test(val)) {
        throw new Error('Business name input did not keep value: ' + val);
      }
    settle_ms: 200

  - action: Save draft
    click: { testId: save-draft-button }
    settle_ms: 1500

  - action: Layout audit
    code: |
      const layout = await page.evaluate(() => {
        const iframe = document.querySelector('[data-testid="preview-frame"] iframe');
        const templatesVisible = [...document.querySelectorAll('.templates-panel')].some((el) => {
          const cs = getComputedStyle(el);
          const r = el.getBoundingClientRect();
          return cs.display !== 'none' && r.width > 40;
        });
        return {
          pageBuilder: !!document.querySelector('[data-testid="page-builder"]'),
          templatesVisible,
          title: document.querySelector('.setup-title h1')?.innerText || '',
          iframeH: iframe ? Math.round(iframe.getBoundingClientRect().height) : 0,
        };
      });
      if (!layout.pageBuilder) throw new Error('PageBuilder should be mounted');
      if (layout.templatesVisible) throw new Error('Template picker should be hidden after template selection');
      if (!/Mantest Beauty Co/i.test(layout.title)) {
        throw new Error('Setup title should reflect renamed business: "' + layout.title + '"');
      }
      if (await page.getByTestId('preview-loading').isVisible()) {
        throw new Error('Renaming should not flash a loading overlay over the preview');
      }
    settle_ms: 200

  - action: Contact inspector
    click: { testId: section-type-contact }
    settle_ms: 800

  - action: Contact form visible
    code: |
      const kind = await page.getByTestId('builder-inspector').getAttribute('data-inspector');
      if (kind !== 'contact') throw new Error('Expected contact inspector, got ' + kind);
      if ((await page.getByTestId('address-privacy-callout').count()) === 0) {
        throw new Error('Address privacy callout missing in Contact');
      }
    settle_ms: 200

  - action: Open add section menu
    click: { testId: add-section-button }
    settle_ms: 500

  - action: Add menu is a dialog
    wait_for: { selector: '[data-testid="add-section-menu"]', timeout: 8000 }

  - action: Escape closes add menu
    press: Escape
    settle_ms: 400

  - action: Add menu closed after Escape
    code: |
      if ((await page.getByTestId('add-section-menu').count()) !== 0) {
        throw new Error('Add menu should close on Escape');
      }
    settle_ms: 200

  - action: Add FAQ section
    click: { testId: add-section-button }
    settle_ms: 400

  - action: Pick FAQ
    wait_for: { selector: '[data-testid="add-type-faq"]', timeout: 8000 }
    click: { testId: add-type-faq }
    settle_ms: 800

  - action: FAQ appears in the list
    wait_for: { selector: '[data-testid="section-type-faq"]', timeout: 8000 }

  - action: Remove FAQ then cancel
    code: |
      const remove = page.locator('[data-remove-type="faq"]');
      if ((await remove.count()) === 0) throw new Error('Remove FAQ missing');
      await remove.click({ timeout: 4000 });
    settle_ms: 400

  - action: Cancel remove
    click: { testId: remove-cancel }
    settle_ms: 400

  - action: FAQ still listed after cancel
    code: |
      if ((await page.getByTestId('section-type-faq').count()) === 0) {
        throw new Error('FAQ should remain after cancel');
      }
    settle_ms: 200

  - action: Remove FAQ confirm
    code: |
      await page.locator('[data-remove-type="faq"]').click({ timeout: 4000 });
    settle_ms: 400

  - action: Confirm remove
    click: { testId: remove-confirm-button }
    settle_ms: 600

  - action: FAQ gone after confirm
    code: |
      if ((await page.getByTestId('section-type-faq').count()) !== 0) {
        throw new Error('FAQ should be gone after confirm');
      }
    settle_ms: 200

  - action: Add FAQ again for hide and reorder
    click: { testId: add-section-button }
    settle_ms: 400

  - action: Pick FAQ again
    wait_for: { selector: '[data-testid="add-type-faq"]', timeout: 8000 }
    click: { testId: add-type-faq }
    settle_ms: 800

  - action: Move hero down with Alt+Arrow
    code: |
      await page.getByTestId('section-type-hero').click({ timeout: 4000 });
      await page.keyboard.press('Alt+ArrowDown');
    settle_ms: 600

  - action: Hero is not first after move
    code: |
      const first = page.locator('[data-testid="section-list"] li').first();
      const id = await first.locator('[data-testid^="section-type-"]').getAttribute('data-testid');
      if (id === 'section-type-hero') throw new Error('Hero should no longer be first after Alt+ArrowDown');
    settle_ms: 200

  - action: Hide services
    code: |
      const hide = page.locator('[data-toggle-type="services"]');
      if ((await hide.count()) === 0) throw new Error('Hide services missing');
      await hide.click({ timeout: 4000 });
    settle_ms: 1000

  - action: Preview drops hidden services
    code: |
      const frame = page.frameLocator('[data-testid="preview-frame"] iframe');
      const body = await frame.locator('body').innerText();
      if (/Professional cut and style/i.test(body)) {
        throw new Error('Hidden services still in preview: ' + body.slice(0, 800));
      }
    settle_ms: 300

  - action: Show services again
    code: |
      const show = page.locator('[data-toggle-type="services"]');
      await show.click({ timeout: 4000 });
    settle_ms: 1000

  - action: Preview restores Haircut
    code: |
      const frame = page.frameLocator('[data-testid="preview-frame"] iframe');
      const body = await frame.locator('body').innerText();
      if (!/Professional cut and style/i.test(body)) {
        throw new Error('Services should return to preview: ' + body.slice(0, 800));
      }
    settle_ms: 300

  - action: Drag hero handle to end
    code: |
      const handle = page.locator('[data-drag-type="hero"]');
      const drop = page.getByTestId('section-drop-end');
      if ((await handle.count()) === 0) throw new Error('Hero drag handle missing');
      await handle.dispatchEvent('dragstart');
      await page.waitForTimeout(120);
      await drop.dispatchEvent('drop');
    settle_ms: 800

  - action: Hero is last after drop
    code: |
      const last = page.locator('[data-testid="section-list"] li').last();
      const id = await last.locator('[data-testid^="section-type-"]').getAttribute('data-testid');
      if (id !== 'section-type-hero') {
        throw new Error('Hero should be last after drop to end, last=' + id);
      }
    settle_ms: 200

  - action: Mobile preview tab
    code: |
      await page.setViewportSize({ width: 390, height: 844 });
      const previewTab = page.getByRole('button', { name: /^Preview$/ });
      await previewTab.click({ timeout: 4000 });
      const iframe = page.locator('[data-testid="preview-frame"] iframe');
      if (!(await iframe.isVisible())) throw new Error('Preview iframe hidden on mobile Preview tab');
      const editorTab = page.getByRole('button', { name: /^Editor$/ });
      await editorTab.click({ timeout: 4000 });
      if (!(await page.getByTestId('page-builder').isVisible())) {
        throw new Error('Page builder hidden on mobile Editor tab');
      }
      await page.setViewportSize({ width: 1400, height: 900 });
    settle_ms: 500

  - action: Change template restores picker
    click: { testId: change-template-button }
    settle_ms: 800
    assert:
      - text contains Templates
