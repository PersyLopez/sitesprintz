url: http://localhost:5173/login
goal: Setup page builder after skip and template — rail, inspector, one live preview, save
steps:
  - action: Login form ready
    wait_for: { text: Welcome Back, timeout: 20000 }

  - action: Enter email
    fill: { testId: login-email, value: "test@example.com", clear: true }

  - action: Enter password
    fill: { testId: login-password, value: "SecurePass!2024", clear: true }

  - action: Submit login
    click: { testId: login-submit }
    settle_ms: 3000

  - action: Dashboard
    wait_for: { url: /dashboard, timeout: 20000 }
    settle_ms: 800

  - action: Dismiss welcome
    code: |
      const dismiss = page.getByTestId('welcome-dismiss');
      if (await dismiss.count()) await dismiss.click({ timeout: 4000 }).catch(() => {});
      else await page.keyboard.press('Escape').catch(() => {});
    settle_ms: 400

  - action: Open setup
    goto: http://localhost:5173/setup
    settle_ms: 1500

  - action: Quick Start present
    wait_for: { selector: '[data-testid="quickstart-wizard"]', timeout: 20000 }
    assert:
      - text contains Quick Start

  - action: Skip to Full Editor
    click: { testId: wizard-skip }
    settle_ms: 1500
    assert:
      - url contains /setup
      - text contains Publish

  - action: Skip-empty editor chrome
    wait_for: { selector: '[data-testid="customize-panel"]', timeout: 15000 }
    settle_ms: 400
    assert:
      - text contains Templates
      - text contains Select a template from the left
      - text contains live preview will appear here

  - action: Skip-empty layout probe
    code: |
      const publish = page.getByTestId('publish-site-button');
      if (!(await publish.isDisabled())) {
        throw new Error('Publish should be disabled with no template');
      }
      const empty = page.locator('.preview-panel .panel-empty, .editor-panel .panel-empty');
      if ((await empty.count()) < 1) {
        throw new Error('Expected empty editor/preview after skip without a template');
      }
    settle_ms: 200

  - action: Use Salon template
    code: |
      const use = page.getByRole('button', { name: /Use Salon template/i });
      if ((await use.count()) === 0) throw new Error('Use Salon template button missing');
      await use.first().click({ timeout: 8000 });
    settle_ms: 2500

  - action: Page builder loads
    wait_for: { selector: '[data-testid="page-builder"]', timeout: 20000 }
    settle_ms: 800
    assert:
      - text contains Beauty Studio
      - text contains Look
      - text contains Add section

  - action: Publish enabled after template
    code: |
      const publish = page.getByTestId('publish-site-button');
      if (await publish.isDisabled()) throw new Error('Publish still disabled after template');
    settle_ms: 200

  - action: Two columns after Salon
    wait_for: { selector: '[data-testid="preview-frame"]', timeout: 15000 }
    code: |
      const layout = await page.evaluate(() => {
        const builder = document.querySelector('[data-testid="page-builder"]');
        const iframe = document.querySelector('[data-testid="preview-frame"] iframe');
        const twoCol = !!document.querySelector('.setup-panels--two-col');
        const device = document.querySelector('[data-testid="device-desktop"]');
        return {
          twoCol,
          hasBuilder: !!builder,
          iframeW: iframe ? Math.round(iframe.getBoundingClientRect().width) : 0,
          iframeH: iframe ? Math.round(iframe.getBoundingClientRect().height) : 0,
          hasDevice: !!device,
        };
      });
      if (!layout.twoCol) throw new Error('Expected setup-panels--two-col after Salon');
      if (!layout.hasBuilder) throw new Error('Page builder missing');
      if (layout.hasDevice) throw new Error('Device preview chrome should be gone');
      if (layout.iframeW < 400) throw new Error('Preview iframe too narrow: ' + layout.iframeW);
      if (layout.iframeH < 200) throw new Error('Preview iframe too short: ' + layout.iframeH);
    settle_ms: 200

  - action: Preview contains salon copy
    code: |
      const frame = page.frameLocator('[data-testid="preview-frame"] iframe');
      const body = await frame.locator('body').innerText();
      if (!/Transform Your Look|Beauty Studio|Professional hair/i.test(body.slice(0, 800))) {
        throw new Error('Preview missing salon copy: ' + body.slice(0, 800));
      }
    settle_ms: 300

  - action: Open Look inspector
    click: { testId: builder-look }
    settle_ms: 800
    assert:
      - text contains Look

  - action: Theme picker visible
    code: |
      if ((await page.getByTestId('theme-picker').count()) === 0) {
        throw new Error('Theme picker missing after Look');
      }
    settle_ms: 200

  - action: Select services section
    click: { testId: section-type-services }
    settle_ms: 800

  - action: Services inspector
    wait_for: { selector: '[data-testid="builder-inspector"]', timeout: 8000 }
    code: |
      const kind = await page.getByTestId('builder-inspector').getAttribute('data-inspector');
      if (kind !== 'services') throw new Error('Expected services inspector, got ' + kind);
    settle_ms: 200

  - action: Hide a section
    code: |
      const hide = page.getByRole('button', { name: /^Hide / });
      if ((await hide.count()) === 0) throw new Error('Hide control missing');
      await hide.first().click({ timeout: 4000 });
    settle_ms: 600

  - action: Open essentials via hero
    click: { testId: section-type-hero }
    settle_ms: 800

  - action: Change business name
    fill: { testId: business-name-input, value: "Mantest Beauty Co", clear: true }
    settle_ms: 800

  - action: Name field keeps the new value
    code: |
      const val = await page.getByTestId('business-name-input').inputValue();
      if (!/Mantest Beauty Co/i.test(val)) {
        throw new Error('Business name input did not keep value: ' + val);
      }
    settle_ms: 200

  - action: Save draft
    click: { testId: save-draft-button }
    settle_ms: 1500

  - action: Layout audit
    code: |
      const layout = await page.evaluate(() => {
        const iframe = document.querySelector('[data-testid="preview-frame"] iframe');
        const templatesVisible = [...document.querySelectorAll('.templates-panel')].some((el) => {
          const cs = getComputedStyle(el);
          const r = el.getBoundingClientRect();
          return cs.display !== 'none' && r.width > 40;
        });
        return {
          pageBuilder: !!document.querySelector('[data-testid="page-builder"]'),
          templatesVisible,
          title: document.querySelector('.setup-title h1')?.innerText || '',
          iframeH: iframe ? Math.round(iframe.getBoundingClientRect().height) : 0,
        };
      });
      if (!layout.pageBuilder) throw new Error('PageBuilder should be mounted');
      if (layout.templatesVisible) throw new Error('Template picker should be hidden after template selection');
      if (!/Mantest Beauty Co/i.test(layout.title)) {
        throw new Error('Setup title should reflect renamed business: "' + layout.title + '"');
      }
    settle_ms: 200

  - action: Change template restores picker
    click: { testId: change-template-button }
    settle_ms: 800
    assert:
      - text contains Templates
