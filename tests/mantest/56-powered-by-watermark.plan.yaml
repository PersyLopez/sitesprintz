url: http://localhost:5173/view/gallery-restaurant
goal: Gallery demo live sites show a clickable Powered by SiteSprintz watermark
steps:
  - action: Restaurant demo loads
    wait_for: { text: The Grand Table, timeout: 20000 }
    settle_ms: 800

  - action: Restaurant demo badge is a Powered-by link
    code: |
      const badge = page.getByTestId('sitesprintz-badge');
      await badge.waitFor({ state: 'visible', timeout: 10000 });
      const href = await badge.getAttribute('href');
      if (href !== 'https://sitesprintz.com') {
        throw new Error('Badge href expected https://sitesprintz.com, got ' + href);
      }
      const text = (await badge.innerText()).trim();
      if (!/Powered by SiteSprintz/i.test(text)) {
        throw new Error('Badge copy expected Powered by SiteSprintz, got: ' + text);
      }
      const tag = await badge.evaluate((el) => el.tagName.toLowerCase());
      if (tag !== 'a') {
        throw new Error('Badge should be a link, got ' + tag);
      }
      const position = await badge.evaluate((el) => getComputedStyle(el).position);
      if (position !== 'fixed') {
        throw new Error('Badge should be position:fixed, got ' + position);
      }
      const box = await badge.boundingBox();
      const viewport = page.viewportSize();
      if (!box || !viewport) {
        throw new Error('Could not measure badge or viewport');
      }
      const inViewport = box.x >= 0 && box.y >= 0
        && box.x + box.width <= viewport.width
        && box.y + box.height <= viewport.height;
      if (!inViewport) {
        throw new Error('Badge not in viewport without scroll: ' + JSON.stringify({ box, viewport }));
      }
      const nearLeft = box.x <= Math.min(16, viewport.width * 0.08);
      if (!nearLeft) {
        throw new Error('Badge should be pinned bottom-left, box.x=' + box.x + ' viewport.width=' + viewport.width);
      }

  - action: Open salon gallery demo
    goto: http://localhost:5173/view/gallery-salon
    settle_ms: 2000

  - action: Salon demo identity visible
    wait_for: { text: Luxe Beauty Studio, timeout: 20000 }
    settle_ms: 400

  - action: Salon demo badge is a Powered-by link
    code: |
      const badge = page.getByTestId('sitesprintz-badge');
      await badge.waitFor({ state: 'visible', timeout: 10000 });
      const href = await badge.getAttribute('href');
      if (href !== 'https://sitesprintz.com') {
        throw new Error('Salon badge href expected https://sitesprintz.com, got ' + href);
      }
      const text = (await badge.innerText()).trim();
      if (!/Powered by SiteSprintz/i.test(text)) {
        throw new Error('Salon badge copy expected Powered by SiteSprintz, got: ' + text);
      }
      const tag = await badge.evaluate((el) => el.tagName.toLowerCase());
      if (tag !== 'a') {
        throw new Error('Salon badge should be a link, got ' + tag);
      }
      const box = await badge.boundingBox();
      const viewport = page.viewportSize();
      if (!box || !viewport) {
        throw new Error('Could not measure salon badge or viewport');
      }
      const nearLeft = box.x <= Math.min(16, viewport.width * 0.08);
      if (!nearLeft) {
        throw new Error('Salon badge should be pinned bottom-left, box.x=' + box.x);
      }

  - action: Mobile viewport restaurant badge bottom-left
    code: |
      await page.setViewportSize({ width: 390, height: 844 });
      await page.goto('http://localhost:5173/view/gallery-restaurant');
      await page.getByText('The Grand Table').waitFor({ state: 'visible', timeout: 20000 });
      const badge = page.getByTestId('sitesprintz-badge');
      await badge.waitFor({ state: 'visible', timeout: 10000 });
      const position = await badge.evaluate((el) => getComputedStyle(el).position);
      if (position !== 'fixed') {
        throw new Error('Mobile badge should be position:fixed, got ' + position);
      }
      const box = await badge.boundingBox();
      const viewport = page.viewportSize();
      if (!box || !viewport) {
        throw new Error('Could not measure mobile badge or viewport');
      }
      const nearLeft = box.x <= Math.min(16, viewport.width * 0.08);
      if (!nearLeft) {
        throw new Error('Mobile badge should be pinned bottom-left, box.x=' + box.x);
      }
