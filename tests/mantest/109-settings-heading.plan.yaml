url: http://localhost:5173/login
goal: Settings billing route announces Billing Management as an h1 before any other heading (QA AX-02)
steps:
  - action: Login form ready
    wait_for: { text: Welcome Back, timeout: 20000 }

  - action: Enter email
    fill: { testId: login-email, value: "test@example.com" }

  - action: Enter password
    fill: { testId: login-password, value: "SecurePass!2024" }

  - action: Submit login
    click: { testId: login-submit }
    settle_ms: 2500

  - action: Dashboard
    wait_for: { url: /dashboard, timeout: 20000 }

  - action: Open settings billing
    goto: http://localhost:5173/settings/billing
    settle_ms: 2000

  - action: First heading on page is Billing Management h1
    code: |
      const firstHeading = page.locator('h1, h2, h3, h4, h5, h6').first();
      await firstHeading.waitFor({ timeout: 15000 });
      const tag = await firstHeading.evaluate((el) => el.tagName.toLowerCase());
      const text = (await firstHeading.innerText()).trim();
      if (tag !== 'h1') {
        throw new Error('First heading on /settings/billing is <' + tag + '>, not <h1>');
      }
      if (!/^Billing Management$/.test(text)) {
        throw new Error('First heading is not exactly Billing Management: ' + text);
      }
    settle_ms: 400
