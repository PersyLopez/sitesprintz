url: http://localhost:5173/login
goal: Products page empty state and add-product modal open without external catalog services
steps:
  - action: Login form ready
    wait_for: { text: Welcome Back, timeout: 20000 }

  - action: Enter email
    fill: { testId: login-email, value: "test@example.com" }

  - action: Enter password
    fill: { testId: login-password, value: "SecurePass!2024" }

  - action: Submit login
    click: { testId: login-submit }
    settle_ms: 2500

  - action: Dashboard
    wait_for: { url: /dashboard, timeout: 20000 }

  - action: Open products
    goto: http://localhost:5173/products
    settle_ms: 2000

  - action: Products tools loaded
    code: |
      const addBtn = page.getByTestId('add-product-btn');
      if ((await addBtn.count()) === 0) {
        const manage = page.getByTestId('manage-site-button').first();
        if ((await manage.count()) === 0) {
          throw new Error('Neither products tools nor a site card after /products: ' + page.url());
        }
        await manage.click();
        await page.getByTestId('site-nav-products').click();
      }
      await page.getByTestId('add-product-btn').waitFor({ timeout: 15000 });
      const t = await page.locator('body').innerText();
      const ok = /Import CSV/i.test(t) && /Export CSV/i.test(t) && /Add Product/i.test(t);
      if (!ok) throw new Error('Products tools missing: ' + t.slice(0, 240));
    settle_ms: 400

  - action: Product catalog uses compact table density
    code: |
      const table = page.getByTestId('products-table');
      const tableCount = await table.count();
      if (tableCount === 0) return;
      const rows = table.locator('tbody tr');
      const rowCount = await rows.count();
      if (rowCount === 0) return;
      const box = await rows.first().boundingBox();
      if (!box) throw new Error('Product row has no measurable bounds');
      if (box.height > 72) {
        throw new Error(`Product row is oversized: ${box.height}px`);
      }
    settle_ms: 300

  - action: Search control works
    fill: { testId: product-search-input, value: "pizza", clear: true }
    settle_ms: 400

  - action: Open add product modal
    click: { testId: add-product-btn }
    settle_ms: 800

  - action: Photo step or form surfaced
    code: |
      const skip = page.getByTestId('product-photo-skip');
      const name = page.getByTestId('product-name-input');
      const dialog = page.locator('[role="dialog"], .modal, .product-modal, form');
      const ok =
        (await skip.count()) > 0 ||
        (await name.count()) > 0 ||
        (await dialog.count()) > 0;
      if (!ok) throw new Error('Add product UI did not open');
    settle_ms: 300

  - action: Close modal without saving
    code: |
      await page.keyboard.press('Escape').catch(() => {});
      const cancel = page.getByRole('button', { name: /cancel|close/i });
      if (await cancel.count()) {
        await cancel.first().click({ timeout: 3000 }).catch(() => {});
      }
    settle_ms: 500
