url: http://localhost:5173/view/plants-and-threads
goal: Live Plants & Threads visitor can place a pay-on-site plant order (synthetic catalog ids)
steps:
  - action: Live site loads
    wait_for: { text: Plants & Threads, timeout: 20000 }
    settle_ms: 800

  - action: Add first plant to cart
    code: |
      const add = page.locator('[data-ss-add-to-cart], [data-testid^="add-to-cart-"]').first();
      await add.waitFor({ timeout: 15000 });
      await add.click();
    settle_ms: 500

  - action: Open cart
    click: { testId: cart-toggle-button }
    settle_ms: 400

  - action: Cart has an item
    wait_for: { selector: '[data-testid="cart-item"]', timeout: 8000 }

  - action: Pay-on-site checkout form visible
    wait_for: { selector: '[data-testid="pay-on-site-checkout"]', timeout: 10000 }

  - action: Place order with synthetic product id
    code: |
      const stamp = Date.now();
      await page.getByTestId('pay-on-site-name').fill('Mantest Buyer');
      await page.getByTestId('pay-on-site-email').fill('mantest-buyer-' + stamp + '@example.com');
      const [response] = await Promise.all([
        page.waitForResponse(
          (r) => r.url().includes('/pay-on-site') && r.request().method() === 'POST',
          { timeout: 20000 }
        ),
        page.getByTestId('pay-on-site-place-order').click(),
      ]);
      const body = await response.text();
      if (response.status() === 500) {
        throw new Error('Pay-on-site SERVER_ERROR: ' + body.slice(0, 300));
      }
      if (response.status() < 200 || response.status() >= 300) {
        throw new Error('Pay-on-site failed HTTP ' + response.status() + ' ' + body.slice(0, 300));
      }
      if (/unexpected error/i.test(body)) {
        throw new Error('Pay-on-site returned unexpected error payload: ' + body.slice(0, 300));
      }
    settle_ms: 600

  - action: Confirmation shown
    wait_for: { selector: '[data-testid="pay-on-site-confirmation"]', timeout: 12000 }
