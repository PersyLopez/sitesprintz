url: http://localhost:5173/
goal: Landing page renders and primary public navigation works
steps:
  - action: See hero and brand
    wait_for: { text: Right Site Light }
    assert:
      - text contains Right Site Light
      - text contains They love what you make
      - text contains Get Your Page Free
      - text contains Read their stories
      - text contains Three plans. Pick how you run it.
      - text contains Starter
      - text contains Growth
      - text contains Growth Managed
    code: |
      if ((await page.locator('main#main-content').count()) !== 1) {
        throw new Error('Landing page should have one main landmark');
      }
      const landingTitle = await page.title();
      if (!landingTitle.includes('Right Site Light')) {
        throw new Error(`Landing page title missing brand: ${landingTitle}`);
      }
      await page.setViewportSize({ width: 1280, height: 800 });
      const heroBrand = page.locator('.hero-brand');
      const heroHeadline = page.locator('.hero-headline');
      const heroBrandSize = await heroBrand.evaluate((element) =>
        parseFloat(window.getComputedStyle(element).fontSize)
      );
      if (heroBrandSize > 48) {
        throw new Error(`Hero brand is too large: ${heroBrandSize}px`);
      }
      if (!(await heroHeadline.isVisible())) {
        throw new Error('Hero headline is not visible');
      }

  - action: Feedback lives in the footer
    code: |
      if (await page.getByTestId('nav-feedback').count()) {
        throw new Error('Public header should not contain feedback navigation');
      }
      if (await page.getByTestId('mobile-nav-feedback').count()) {
        throw new Error('Public mobile navigation should not contain feedback');
      }
      const feedback = page.getByTestId('footer-feedback');
      if (!(await feedback.isVisible())) throw new Error('Footer feedback button missing');
      await feedback.click();
      if (!(await page.getByRole('heading', { name: 'Send Feedback' }).isVisible())) {
        throw new Error('Footer feedback button did not open the widget');
      }
      await page.getByRole('button', { name: 'Close feedback' }).click();

  - action: Customer stories section
    goto: http://localhost:5173/#stories
    wait_for: { text: They had regulars. Tomorrow nobody could find them. }
    assert:
      - text contains Maria
      - text contains James
      - text contains Aisha
      - text contains They had regulars. Tomorrow nobody could find them.
      - text contains Small shops like yours

  - action: Keyboard focus shows nav ring
    code: |
      await page.getByTestId('header-logo').focus();
      await page.keyboard.press('Tab');
      const focusState = await page.evaluate(() => {
        const element = document.activeElement;
        if (!(element instanceof HTMLElement) || !element.matches('.nav-link')) {
          return { isNavLink: false };
        }
        const style = window.getComputedStyle(element);
        return {
          isNavLink: true,
          outlineStyle: style.outlineStyle,
          outlineWidth: parseFloat(style.outlineWidth),
        };
      });
      if (!focusState.isNavLink) throw new Error('Tab did not focus a nav link');
      if (focusState.outlineStyle === 'none' || focusState.outlineWidth < 2) {
        throw new Error(`Nav focus ring missing: ${JSON.stringify(focusState)}`);
      }

  - action: Dismiss setup offer modal if visible
    code: |
      const dismiss = page.getByTestId('setup-offer-dismiss');
      if (await dismiss.isVisible()) {
        await dismiss.click({ timeout: 5000 });
        await page.waitForTimeout(400);
      }

  - action: Open Gallery from header
    click: { testId: nav-gallery }
    assert:
      - url contains /showcase

  - action: Return home via logo
    click: { testId: header-logo }
    assert:
      - url equals http://localhost:5173/
      - text contains They love what you make

  - action: Open Pricing section from header
    click: { testId: nav-pricing }
    settle_ms: 400
    assert:
      - text contains Three plans. Pick how you run it.
    code: |
      const pricingSection = page.locator('#pricing');
      const pricingBox = await pricingSection.boundingBox();
      const headerBox = await page.locator('header').boundingBox();
      if (!pricingBox || !headerBox || pricingBox.y < headerBox.y + headerBox.height) {
        throw new Error('Pricing section is hidden under the sticky header');
      }

  - action: Open Login from header
    code: |
      await page.getByTestId('nav-login').click();
      await page.waitForURL(/\/login/, { timeout: 10000 });
      if (!(await page.getByText('Welcome Back').isVisible())) {
        throw new Error('Login page welcome text missing');
      }
      if ((await page.locator('main#main-content').count()) !== 1) {
        throw new Error('Login page should have one main landmark');
      }
      await page.waitForFunction(() => document.title.includes('Login'));
      const loginTitle = await page.title();
      if (!loginTitle.includes('Login') || !loginTitle.includes('Right Site Light')) {
        throw new Error(`Login page title incorrect: ${loginTitle}`);
      }

  - action: Open Get Started from header
    code: |
      await page.getByTestId('nav-get-started').click();
      await page.waitForURL(/\/register/, { timeout: 10000 });
      if (!(await page.getByText('Create Your Account').isVisible())) {
        throw new Error('Register page heading missing');
      }
      if ((await page.locator('main#main-content').count()) !== 1) {
        throw new Error('Register page should have one main landmark');
      }
      await page.waitForFunction(() => document.title.includes('Get Your Page Free'));
      const registerTitle = await page.title();
      if (!registerTitle.includes('Get Your Page Free') || !registerTitle.includes('Right Site Light')) {
        throw new Error(`Register page title incorrect: ${registerTitle}`);
      }
