url: http://localhost:5173/
goal: Landing page renders and primary public navigation works
steps:
  - action: See hero and brand
    wait_for: { text: Right Site Light }
    assert:
      - text contains Right Site Light
      - text contains They love what you make
      - text contains Get Your Page Free
      - text contains Read their stories
      - text contains Three plans. Pick how you run it.
      - text contains Starter
      - text contains Growth
      - text contains Growth Managed
    code: |
      if ((await page.locator('main#main-content').count()) !== 1) {
        throw new Error('Landing page should have one main landmark');
      }
      const landingTitle = await page.title();
      if (!landingTitle.includes('Right Site Light')) {
        throw new Error(`Landing page title missing brand: ${landingTitle}`);
      }
      await page.setViewportSize({ width: 1280, height: 800 });
      const heroBrand = page.locator('.hero-brand');
      const heroHeadline = page.locator('.hero-headline');
      const heroBrandSize = await heroBrand.evaluate((element) =>
        parseFloat(window.getComputedStyle(element).fontSize)
      );
      if (heroBrandSize > 48) {
        throw new Error(`Hero brand is too large: ${heroBrandSize}px`);
      }
      if (!(await heroHeadline.isVisible())) {
        throw new Error('Hero headline is not visible');
      }
      const chrome = await page.evaluate(() => {
        const hero = document.querySelector('.landing-hero');
        const minHeight = hero ? window.getComputedStyle(hero).minHeight : '';
        const minHeightPx = parseFloat(minHeight);
        const paddingTops = ['stories', 'purpose', 'how', 'pricing', 'final-cta'].map((cls) => {
          const el = document.querySelector(`.${cls}-section, .${cls}`);
          return el ? parseFloat(window.getComputedStyle(el).paddingTop) : NaN;
        });
        return { minHeight, minHeightPx, paddingTops };
      });
      if (chrome.minHeight === '100vh' || chrome.minHeightPx === 800) {
        throw new Error(`Hero min-height still full viewport: ${chrome.minHeight}`);
      }
      if (chrome.paddingTops.some((px) => px !== 64 && px !== 88)) {
        throw new Error(`Section padding-top not 64/88: ${JSON.stringify(chrome.paddingTops)}`);
      }

  - action: Mobile CTAs do not overlap the hero caption
    code: |
      const dismiss = page.getByTestId('setup-offer-dismiss');
      if (await dismiss.isVisible()) {
        await dismiss.click({ timeout: 5000 });
        await page.waitForTimeout(400);
      }
      await page.setViewportSize({ width: 390, height: 844 });
      await page.evaluate(() => window.scrollTo(0, 0));
      const secondary = page.locator('.landing-hero .btn-secondary-large');
      const caption = page.locator('.hero-ambient-caption');
      await secondary.waitFor({ state: 'visible', timeout: 10000 });
      await caption.waitFor({ state: 'visible', timeout: 10000 });
      const mobile = await page.evaluate(() => {
        const cta = document.querySelector('.landing-hero .btn-secondary-large');
        const cap = document.querySelector('.hero-ambient-caption');
        if (!cta || !cap) return { missing: true };
        const a = cta.getBoundingClientRect();
        const b = cap.getBoundingClientRect();
        const hit = !(a.right <= b.left || a.left >= b.right || a.bottom <= b.top || a.top >= b.bottom);
        return {
          hit,
          ctaVisible: a.width > 0 && a.height > 0,
          capVisible: b.width > 0 && b.height > 0,
        };
      });
      if (mobile.missing || !mobile.ctaVisible || !mobile.capVisible) {
        throw new Error('CTA or caption missing at 390');
      }
      if (mobile.hit) {
        throw new Error('Read their stories overlaps the hero caption at 390');
      }
      await page.setViewportSize({ width: 1280, height: 800 });
      const desktop = await page.evaluate(() => {
        const cta = document.querySelector('.hero-cta-row');
        const cap = document.querySelector('.hero-ambient-caption');
        const hero = document.querySelector('.landing-hero');
        if (!cta || !cap || !hero) return { missing: true };
        const cr = cta.getBoundingClientRect();
        const capr = cap.getBoundingClientRect();
        const hr = hero.getBoundingClientRect();
        return {
          captionOnRight: capr.left > hr.left + hr.width * 0.45,
          ctaInCopy: cr.right < hr.left + hr.width * 0.55,
        };
      });
      if (desktop.missing) throw new Error('Desktop hero nodes missing');
      if (!desktop.captionOnRight) throw new Error('Caption not on the right at 1280');
      if (!desktop.ctaInCopy) throw new Error('CTAs not in the copy column at 1280');

  - action: Header lockup is compact
    code: |
      await page.setViewportSize({ width: 1280, height: 800 });
      const metrics = await page.getByTestId('header-logo').evaluate((el) => {
        const style = window.getComputedStyle(el);
        const mark = el.querySelector('.logo-mark');
        const text = el.querySelector('.logo-text');
        const box = mark ? mark.getBoundingClientRect() : { height: 0, width: 0 };
        const gap = parseFloat(style.columnGap || style.gap);
        return {
          gap,
          markHeight: box.height,
          markWidth: box.width,
          hasMark: Boolean(mark),
          wordmark: text ? text.textContent.trim() : '',
          aria: el.getAttribute('aria-label'),
        };
      });
      if (!metrics.hasMark) throw new Error('Header logo mark missing');
      if (metrics.wordmark !== 'Right Site Light') {
        throw new Error(`Wordmark hidden or changed: ${metrics.wordmark}`);
      }
      if (!(metrics.gap < 12)) {
        throw new Error(`Logo gap not tighter than 12px: ${metrics.gap}`);
      }
      if (!(metrics.markHeight <= 68)) {
        throw new Error(`Logo mark taller than 68px: ${metrics.markHeight}`);
      }
      if (!(metrics.markWidth <= 160)) {
        throw new Error(`Logo mark wider than 160px: ${metrics.markWidth}`);
      }
      if (!metrics.aria) {
        throw new Error('header.home aria-label missing on logo');
      }
      await page.setViewportSize({ width: 534, height: 800 });
      const readHeaderChrome = async () =>
        page.locator('.site-header').evaluate((el) => {
          const style = window.getComputedStyle(el);
          return {
            bg: style.backgroundColor,
            backdrop: style.backdropFilter || style.webkitBackdropFilter || 'none',
          };
        });
      const chromeAlpha = (bg) => {
        const match = bg.match(/[\d.]+/g);
        if (!match) return 1;
        if (bg.startsWith('rgb(') && !bg.startsWith('rgba(')) return 1;
        return match.length >= 4 ? Number(match[3]) : 0;
      };
      const assertTransparentChrome = (paint, label) => {
        if (chromeAlpha(paint.bg) > 0.08) {
          throw new Error(`Header ${label} should be transparent, got ${paint.bg}`);
        }
        const backdrop = String(paint.backdrop || 'none').replace(/\s/g, '').toLowerCase();
        if (backdrop !== 'none') {
          throw new Error(`Header ${label} backdrop-filter should be none, got ${paint.backdrop}`);
        }
      };
      await page.evaluate(() => window.scrollTo(0, 0));
      assertTransparentChrome(await readHeaderChrome(), 'at rest');
      await page.evaluate(() => window.scrollTo(0, 80));
      await page.waitForFunction(() =>
        document.querySelector('.site-header')?.classList.contains('scrolled')
      );
      assertTransparentChrome(await readHeaderChrome(), 'when scrolled');
      await page.evaluate(() => window.scrollTo(0, 0));
      await page.setViewportSize({ width: 1280, height: 800 });

  - action: Feedback lives in the footer
    code: |
      if (await page.getByTestId('nav-feedback').count()) {
        throw new Error('Public header should not contain feedback navigation');
      }
      if (await page.getByTestId('mobile-nav-feedback').count()) {
        throw new Error('Public mobile navigation should not contain feedback');
      }
      const feedback = page.getByTestId('footer-feedback');
      if (!(await feedback.isVisible())) throw new Error('Footer feedback button missing');
      await feedback.click();
      if (!(await page.getByRole('heading', { name: 'Send Feedback' }).isVisible())) {
        throw new Error('Footer feedback button did not open the widget');
      }
      await page.getByRole('button', { name: 'Close feedback' }).click();

  - action: Customer stories section
    goto: http://localhost:5173/#stories
    wait_for: { text: They had regulars. Tomorrow nobody could find them. }
    assert:
      - text contains Maria
      - text contains James
      - text contains Aisha
      - text contains They had regulars. Tomorrow nobody could find them.
      - text contains Small shops like yours

  - action: Keyboard focus shows nav ring
    code: |
      await page.getByTestId('header-logo').focus();
      await page.keyboard.press('Tab');
      const focusState = await page.evaluate(() => {
        const element = document.activeElement;
        if (!(element instanceof HTMLElement) || !element.matches('.nav-link')) {
          return { isNavLink: false };
        }
        const style = window.getComputedStyle(element);
        return {
          isNavLink: true,
          outlineStyle: style.outlineStyle,
          outlineWidth: parseFloat(style.outlineWidth),
        };
      });
      if (!focusState.isNavLink) throw new Error('Tab did not focus a nav link');
      if (focusState.outlineStyle === 'none' || focusState.outlineWidth < 2) {
        throw new Error(`Nav focus ring missing: ${JSON.stringify(focusState)}`);
      }

  - action: Dismiss setup offer modal if visible
    code: |
      const dismiss = page.getByTestId('setup-offer-dismiss');
      if (await dismiss.isVisible()) {
        await dismiss.click({ timeout: 5000 });
        await page.waitForTimeout(400);
      }

  - action: Open Gallery from header
    click: { testId: nav-gallery }
    assert:
      - url contains /showcase

  - action: Return home via logo
    click: { testId: header-logo }
    assert:
      - url equals http://localhost:5173/
      - text contains They love what you make

  - action: Open Pricing section from header
    click: { testId: nav-pricing }
    settle_ms: 400
    assert:
      - text contains Three plans. Pick how you run it.
    code: |
      const pricingSection = page.locator('#pricing');
      const pricingBox = await pricingSection.boundingBox();
      const headerBox = await page.locator('header').boundingBox();
      if (!pricingBox || !headerBox || pricingBox.y < headerBox.y + headerBox.height) {
        throw new Error('Pricing section is hidden under the sticky header');
      }

  - action: Open Login from header
    code: |
      await page.getByTestId('nav-login').click();
      await page.waitForURL(/\/login/, { timeout: 10000 });
      if (!(await page.getByText('Welcome Back').isVisible())) {
        throw new Error('Login page welcome text missing');
      }
      if ((await page.locator('main#main-content').count()) !== 1) {
        throw new Error('Login page should have one main landmark');
      }
      await page.waitForFunction(() => document.title.includes('Login'));
      const loginTitle = await page.title();
      if (!loginTitle.includes('Login') || !loginTitle.includes('Right Site Light')) {
        throw new Error(`Login page title incorrect: ${loginTitle}`);
      }

  - action: Open Get Started from header
    code: |
      await page.getByTestId('nav-get-started').click();
      await page.waitForURL(/\/register/, { timeout: 10000 });
      if (!(await page.getByText('Create Your Account').isVisible())) {
        throw new Error('Register page heading missing');
      }
      if ((await page.locator('main#main-content').count()) !== 1) {
        throw new Error('Register page should have one main landmark');
      }
      await page.waitForFunction(() => document.title.includes('Get Your Page Free'));
      const registerTitle = await page.title();
      if (!registerTitle.includes('Get Your Page Free') || !registerTitle.includes('Right Site Light')) {
        throw new Error(`Register page title incorrect: ${registerTitle}`);
      }
