url: http://localhost:5173/
goal: Landing page renders and primary public navigation works
steps:
  - action: See hero and brand
    wait_for: { text: SiteSprintz }
    assert:
      - text contains SiteSprintz
      - text contains They love what you make
      - text contains Get Your Page Free
      - text contains Read their stories
      - text contains Three plans. Pick how you run it.
      - text contains Starter
      - text contains Growth

  - action: Open Gallery from header
    click: { testId: nav-gallery }
    assert:
      - url contains /showcase

  - action: Return home via logo
    click: { testId: header-logo }
    assert:
      - url equals http://localhost:5173/
      - text contains They love what you make

  - action: Open Pricing section from header
    click: { testId: nav-pricing }
    settle_ms: 400
    assert:
      - text contains Three plans. Pick how you run it.

  - action: Open Login from header
    click: { testId: nav-login }
    assert:
      - url contains /login
      - text contains Welcome Back

  - action: Open Get Started from header
    click: { testId: nav-get-started }
    assert:
      - url contains /register
      - text contains Create Your Account
