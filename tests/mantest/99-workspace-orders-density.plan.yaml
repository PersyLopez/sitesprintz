url: http://localhost:5173/login
goal: Workspace Orders renders a compact, usable data table
steps:
  - action: Login form ready
    wait_for: { text: Welcome Back, timeout: 20000 }

  - action: Enter owner credentials
    fill: { testId: login-email, value: "test@example.com" }

  - action: Enter owner password
    fill: { testId: login-password, value: "SecurePass!2024" }

  - action: Submit login
    click: { testId: login-submit }
    settle_ms: 3000

  - action: Reach site workspace
    wait_for: { url: /dashboard, timeout: 20000 }
    settle_ms: 800
    code: |
      if ((await page.getByTestId('site-dashboard').count()) === 0) {
        const manage = page.getByTestId('manage-site-button').first();
        if ((await manage.count()) === 0) throw new Error('No site workspace or Manage button after login');
        await manage.click();
      }
      await page.getByTestId('site-dashboard').waitFor({ timeout: 15000 });

  - action: Open Orders workspace
    click: { testId: site-nav-orders }
    settle_ms: 1200
    wait_for: { selector: '[data-testid="orders-filter-all"]', timeout: 15000 }

  - action: Orders pane remains visible
    code: |
      if ((await page.getByTestId('orders-filter-all').count()) === 0) {
        throw new Error('Orders pane is not visible');
      }

  - action: Export control remains available
    code: |
      const exportButton = page.getByRole('button', { name: /Export CSV/i });
      await exportButton.waitFor({ timeout: 5000 });
      if (!(await exportButton.isVisible())) throw new Error('Export CSV is not visible');
      await exportButton.click();

  - action: Orders table stays compact
    code: |
      const table = page.getByTestId('orders-table');
      if ((await table.count()) === 0) {
        if ((await page.getByTestId('orders-empty-state').count()) > 0) return;
        throw new Error('Orders table or empty state is not visible');
      }
      const rows = table.locator('tbody tr');
      const count = await rows.count();
      if (count === 0) return;
      const box = await rows.first().boundingBox();
      if (!box) throw new Error('Order row has no bounding box');
      if (box.height > 72) throw new Error('Order row is too tall: ' + box.height);
      await rows.first().click();
      await page.getByTestId('order-details-modal').waitFor({ timeout: 5000 });
      const modalButtons = page.getByTestId('order-details-modal').getByRole('button');
      const buttonText = await modalButtons.allTextContents();
      if (buttonText.some((text) => /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(text))) {
        throw new Error('Order modal buttons contain emoji');
      }
