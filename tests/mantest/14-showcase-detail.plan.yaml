url: http://localhost:5173/showcase
goal: Showcase gallery opens a demo site detail page and visit link works in-app
steps:
  - action: Gallery loads
    wait_for: { text: See how your site could look, timeout: 20000 }
    settle_ms: 2000

  - action: Wait for grid
    wait_for: { selector: '[data-testid="showcase-grid"]', timeout: 20000 }
    settle_ms: 500

  - action: Open first View Details
    code: |
      const card = page.locator('[data-testid^="site-card-"] a.site-card-link').first();
      if (await card.count()) {
        await card.click();
        return;
      }
      const details = page.getByText(/See this look/i);
      if (await details.count()) {
        await details.first().click({ force: true });
        return;
      }
      const empty = await page.getByTestId('showcase-empty-cta').count();
      if (empty) return;
      throw new Error('No showcase cards or empty state');
    settle_ms: 2500

  - action: Detail page content
    code: |
      const url = page.url();
      const t = await page.locator('body').innerText();
      if (url.includes('/showcase/')) {
        const ok = /Visit example|Open live preview|Visit|Demo|Growth|Starter|Pro|Template|View Site|VISIT SITE|See how your site/i.test(t);
        if (!ok) throw new Error('Showcase detail missing expected content: ' + t.slice(0, 200));
        return;
      }
      if (/No examples found|Start your site|See how your site could look/i.test(t)) return;
      throw new Error('Neither detail nor gallery empty state. url=' + url);
    settle_ms: 400

  - action: Showcase detail hero and sharing
    code: |
      if (!page.url().includes('/showcase/')) return;
      const heroImage = page.locator('.hero-image img');
      const fallback = page.locator('.hero-image-fallback');
      if ((await heroImage.count()) > 0) {
        const naturalWidth = await heroImage.first().evaluate((image) => image.naturalWidth);
        if (naturalWidth === 0) throw new Error('Showcase hero image failed to load');
      } else if ((await fallback.count()) === 0) {
        throw new Error('Showcase hero has neither image nor category fallback');
      }
      const share = page.locator('.showcase-share');
      const copyLink = share.getByRole('button', { name: /Copy Link|Copied/i });
      if ((await copyLink.count()) === 0) throw new Error('Copy Link is outside the share section');
      if (/onyx-ink/i.test(await page.locator('body').innerText())) {
        throw new Error('Raw theme slug rendered on showcase detail');
      }
      const title = page.locator('.hero-content h1');
      if (await title.count()) {
        const titleBox = await title.boundingBox();
        const textAlign = await title.evaluate((element) => getComputedStyle(element).textAlign);
        if (!titleBox || textAlign !== 'left') {
          throw new Error('Showcase detail title is not aligned with hero content');
        }
      }
    settle_ms: 400
